  {id:"u23",name:"Jaime Jaramillo",firstName:"Jaime",lastName:"Jaramillo",email:"j.jaramillo@censusconsultores-contabilidad.com",password:"JARA2024",role:"junior",avatar:"🎯"},

const ts=()=>Date.now();
const msToH=ms=>Math.round((ms/3600000)*100)/100;
const fmtT=ms=>{const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return h>0?`${h}h ${m%60}m ${s%60}s`:m>0?`${m}m ${s%60}s`:`${s}s`;};
const fmtDate=ms=>new Date(ms).toLocaleDateString("es-EC",{day:"2-digit",month:"short",year:"numeric"});
const mkTask=o=>({id:"t"+ts(),status:"inprogress",startedAt:ts(),pausedAt:null,activeMs:0,completedAt:null,hours:null,autopaused:false,observacion:null,eventoNombre:null,urgente:false,subtasks:[],...o});
const liveMs=i=>(i.status==="done"||i.status==="paused"||i.status==="queued")?i.activeMs:i.activeMs+(ts()-i.startedAt);
const isWorkHour=()=>{const t=new Date().getHours()*60+new Date().getMinutes();return t>=540&&t<1050;};
const rc=r=>ROLES[r]?.color||P.gray;
const rbg=r=>ROLES[r]?.bg||P.lightG;
const rl=r=>ROLES[r]?.label||r;
const rBadge=r=>({background:rbg(r),color:rc(r),border:`1px solid ${rc(r)}44`,padding:"2px 8px",borderRadius:99,fontSize:11,fontWeight:700,display:"inline-block"});
const iSt={width:"100%",marginTop:4,marginBottom:12,padding:"9px 10px",border:`1.5px solid ${P.border}`,borderRadius:7,fontSize:13,boxSizing:"border-box",outline:"none",background:P.white};

const fbSet=async(col,id,data)=>{if(!window._db)return;try{await window._set(window._doc(window._db,col,String(id)),data);}catch(e){console.error(e);}};
const fbDel=async(col,id)=>{if(!window._db)return;try{await window._del(window._doc(window._db,col,String(id)));}catch(e){console.error(e);}};

function Modal({title,onClose,children,wide}){
  return <div style={{position:"fixed",inset:0,background:"#00000077",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:8}}>
    <div style={{background:P.white,borderRadius:14,padding:24,width:wide?600:480,maxWidth:"95vw",boxShadow:"0 8px 32px #00000044",maxHeight:"92vh",overflowY:"auto",border:`1px solid ${P.border}`,animation:"fadeIn .18s ease"}}>
      {title&&<h3 style={{margin:"0 0 14px",color:P.black,borderBottom:`2px solid ${P.gold}`,paddingBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span>{title}</span>
        <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:P.gray}}>×</button>
      </h3>}
      {children}
    </div>
  </div>;
}
function BtnRow({onCancel,onConfirm,label,color,disabled}){
  return <div style={{display:"flex",gap:10}}>
    <button onClick={onCancel} style={{flex:1,padding:10,border:`1.5px solid ${P.border}`,borderRadius:8,background:P.white,cursor:"pointer",fontWeight:600,color:P.gray}}>Cancelar</button>
    <button onClick={onConfirm} disabled={disabled} style={{flex:1,padding:10,background:disabled?"#ccc":color||P.gold,color:P.white,border:"none",borderRadius:8,fontWeight:700,cursor:disabled?"not-allowed":"pointer",opacity:disabled?0.7:1}}>{label}</button>
  </div>;
}

// ── COMPONENTE PROYECTO (sesiones) ────────────────────────────────────────
function ProyectoCard({proj,cur,users,clients,onUpdate,onDelete}){
  const[expanded,setExpanded]=useState(false);
  const[showIniciar,setShowIniciar]=useState(false);
  const[showCerrar,setShowCerrar]=useState(false);
  const[showNSub,setShowNSub]=useState(false);
  const[descSesion,setDescSesion]=useState("");
  const[obsSesion,setObsSesion]=useState("");
  const[nst,setNst]=useState({title:"",assignedTo:""});

  const cl=clients.find(c=>String(c.id)===String(proj.clientId));
  const asignador=users.find(u=>String(u.id)===String(proj.assignedBy));
  const sesiones=proj.sesiones||[];
  const sesionActiva=sesiones.find(s=>s.status==="activa");
  const totalMs=sesiones.reduce((acc,s)=>acc+(s.status==="activa"?s.activeMs+(ts()-s.startedAt):s.activeMs),0);
  const subTo=users.filter(u=>["junior"].includes(u.role));
  const isOwner=String(proj.assignedTo)===String(cur.id);

  const iniciarSesion=async()=>{
    if(!descSesion.trim())return;
    const nueva={id:"s"+ts(),desc:descSesion.trim(),startedAt:ts(),activeMs:0,status:"activa",fecha:ts()};
    const updated={...proj,sesiones:[...sesiones,nueva],status:"activo"};
    await fbSet("projects",proj.id,updated);
    setDescSesion("");setShowIniciar(false);
  };

  const cerrarSesion=async()=>{
    if(!sesionActiva)return;
    const ms=sesionActiva.activeMs+(ts()-sesionActiva.startedAt);
    const updSesiones=sesiones.map(s=>s.id===sesionActiva.id?{...s,status:"cerrada",activeMs:ms,cerradaAt:ts(),obs:obsSesion.trim()||null}:s);
    const updated={...proj,sesiones:updSesiones,status:"activo"};
    await fbSet("projects",proj.id,updated);
    setObsSesion("");setShowCerrar(false);
  };

  const completarProyecto=async()=>{
    let updSesiones=sesiones;
    if(sesionActiva){
      const ms=sesionActiva.activeMs+(ts()-sesionActiva.startedAt);
      updSesiones=sesiones.map(s=>s.id===sesionActiva.id?{...s,status:"cerrada",activeMs:ms,cerradaAt:ts()}:s);
    }
    const updated={...proj,sesiones:updSesiones,status:"completado",completadoAt:ts(),totalHoras:msToH(totalMs)};
    await fbSet("projects",proj.id,updated);
  };

  const addSubtask=async()=>{
    if(!nst.title||!nst.assignedTo)return;
    const st=mkTask({title:nst.title,assignedTo:nst.assignedTo,assignedBy:cur.id});
    const updated={...proj,subtasks:[...(proj.subtasks||[]),st]};
    await fbSet("projects",proj.id,updated);
    setNst({title:"",assignedTo:""});setShowNSub(false);
  };

  const updSubtask=async(sid,fn)=>{
    const updated={...proj,subtasks:(proj.subtasks||[]).map(s=>String(s.id)===String(sid)?fn(s):s)};
    await fbSet("projects",proj.id,updated);
  };

  const isCompletado=proj.status==="completado";
  const liveTotal=sesionActiva?totalMs:totalMs;

  return <div style={{background:P.white,borderRadius:12,border:`2px solid ${sesionActiva?"#0F766E":isCompletado?"#BBF7D0":P.border}`,padding:16,marginBottom:12,boxShadow:sesionActiva?`0 2px 16px #0F766E33`:"0 1px 4px #00000011",animation:"fadeIn .2s ease"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
      <div style={{flex:1,minWidth:180}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
          <span style={{background:"#CCFBF1",color:P.proj,fontSize:10,padding:"2px 8px",borderRadius:99,fontWeight:800,border:`1px solid #99F6E4`}}>🗂 PROYECTO</span>
          {isCompletado&&<span style={{background:"#DCFCE7",color:P.success,fontSize:10,padding:"2px 8px",borderRadius:99,fontWeight:700}}>✅ Completado</span>}
          {sesionActiva&&<span style={{background:"#CCFBF1",color:P.proj,fontSize:10,padding:"2px 8px",borderRadius:99,fontWeight:700,animation:"pulse 2s infinite"}}>🟢 Sesión activa</span>}
          <span style={{fontWeight:800,color:P.black,fontSize:14}}>{proj.nombre}</span>
        </div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
          {cl&&<span style={{fontSize:11,color:P.goldD,background:P.lightG,padding:"2px 8px",borderRadius:99,border:`1px solid ${P.border}`}}>🏢 {cl.compania}</span>}
          {proj.tipoDevolucion&&<span style={{fontSize:11,color:"#1A4A7A",background:"#D6E8F7",padding:"2px 8px",borderRadius:99}}>📋 {proj.tipoDevolucion}</span>}
          {proj.periodo&&<span style={{fontSize:11,color:P.gray,background:P.lightG,padding:"2px 8px",borderRadius:99}}>📅 {proj.periodo}</span>}
          {asignador&&<span style={{fontSize:11,color:P.gray}}>por {asignador.firstName}</span>}
          <span style={{fontSize:11,color:P.gray}}>📁 {sesiones.length} sesión{sesiones.length!==1?"es":""}</span>
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
        <div style={{background:sesionActiva?"#CCFBF1":P.lightG,border:`1.5px solid ${sesionActiva?P.proj:P.border}`,borderRadius:8,padding:"6px 14px",textAlign:"center",minWidth:120}}>
          <div style={{fontSize:10,fontWeight:700,color:P.proj,letterSpacing:1}}>⏱ TOTAL PROYECTO</div>
          <div style={{fontSize:15,fontWeight:800,color:P.black,fontVariantNumeric:"tabular-nums"}}>{fmtT(liveTotal)}</div>
          <div style={{fontSize:10,color:P.gray}}>≈ {msToH(liveTotal)}h acumuladas</div>
        </div>
        {!isCompletado&&isOwner&&<div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
          {!sesionActiva&&<button onClick={()=>setShowIniciar(true)} style={{padding:"6px 12px",background:P.proj,color:P.white,border:"none",borderRadius:7,fontWeight:700,cursor:"pointer",fontSize:12}}>▶ Iniciar sesión</button>}
          {sesionActiva&&<button onClick={()=>setShowCerrar(true)} style={{padding:"6px 12px",background:P.goldD,color:P.white,border:"none",borderRadius:7,fontWeight:700,cursor:"pointer",fontSize:12}}>⏹ Cerrar sesión</button>}
          <button onClick={()=>setShowNSub(true)} style={{padding:"6px 12px",background:P.black,color:P.gold,border:`1px solid ${P.gold}`,borderRadius:7,fontWeight:600,cursor:"pointer",fontSize:12}}>+ Sub-tarea</button>
          <button onClick={completarProyecto} style={{padding:"6px 12px",background:P.gold,color:P.black,border:"none",borderRadius:7,fontWeight:700,cursor:"pointer",fontSize:12}}>✅ Completar</button>
        </div>}
        <div style={{display:"flex",gap:5}}>
          <button onClick={()=>setExpanded(v=>!v)} style={{padding:"5px 10px",background:P.lightG,border:`1px solid ${P.border}`,borderRadius:7,cursor:"pointer",fontSize:11,color:P.gray,fontWeight:600}}>{expanded?"▲ Ocultar":"▼ Ver sesiones"}</button>
          <button onClick={()=>onDelete(proj.id)} style={{padding:"5px 9px",background:"#FEF2F2",color:P.danger,border:"1px solid #FECACA",borderRadius:7,cursor:"pointer",fontSize:12}}>🗑️</button>
        </div>
      </div>
    </div>

    {/* Sesión activa en curso */}
    {sesionActiva&&<div style={{marginTop:10,background:"#F0FDFA",border:`1px solid #99F6E4`,borderRadius:8,padding:"10px 14px"}}>
      <div style={{fontSize:11,fontWeight:700,color:P.proj,marginBottom:4}}>SESIÓN EN CURSO</div>
      <div style={{fontSize:13,color:P.dark,marginBottom:4}}>📝 {sesionActiva.desc}</div>
      <div style={{fontSize:12,fontWeight:700,color:P.proj,fontVariantNumeric:"tabular-nums"}}>⏱ {fmtT(sesionActiva.activeMs+(ts()-sesionActiva.startedAt))}</div>
    </div>}

    {/* Historial sesiones */}
    {expanded&&<div style={{marginTop:10,borderTop:`1px solid ${P.border}`,paddingTop:10}}>
      <div style={{fontSize:11,fontWeight:700,color:P.goldD,marginBottom:8,letterSpacing:1}}>HISTORIAL DE SESIONES</div>
      {sesiones.filter(s=>s.status==="cerrada").length===0&&<div style={{fontSize:12,color:P.gray,fontStyle:"italic",marginBottom:8}}>Sin sesiones cerradas aún.</div>}
      {sesiones.filter(s=>s.status==="cerrada").map((s,i)=><div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"8px 10px",background:i%2===0?P.white:P.lightG,borderRadius:7,marginBottom:4,border:`1px solid ${P.border}44`,flexWrap:"wrap",gap:6}}>
        <div style={{flex:1}}>
          <div style={{fontSize:12,fontWeight:600,color:P.black}}>📝 {s.desc}</div>
          {s.obs&&<div style={{fontSize:11,color:P.gray,marginTop:2}}>💬 {s.obs}</div>}
          <div style={{fontSize:11,color:P.gray,marginTop:2}}>📅 {fmtDate(s.fecha)}</div>
        </div>
        <div style={{background:P.lightG,border:`1px solid ${P.border}`,borderRadius:6,padding:"4px 10px",textAlign:"center",flexShrink:0}}>
          <div style={{fontSize:10,color:P.goldD,fontWeight:700}}>DURACIÓN</div>
          <div style={{fontSize:13,fontWeight:800,color:P.black}}>{msToH(s.activeMs)}h</div>
        </div>
      </div>)}

      {/* Sub-tareas del proyecto */}
      {(proj.subtasks||[]).length>0&&<>
        <div style={{fontSize:11,fontWeight:700,color:P.goldD,margin:"12px 0 6px",letterSpacing:1}}>SUB-TAREAS ASIGNADAS</div>
        {(proj.subtasks||[]).map(st=>{
          const stu=users.find(u=>String(u.id)===String(st.assignedTo));
          const sa=liveMs(st),sr=st.status==="inprogress",sp=st.status==="paused",sd=st.status==="done";
          const stA=String(st.assignedTo)===String(cur.id);
          return <div key={st.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 10px",background:P.lightG,borderRadius:7,marginBottom:4,flexWrap:"wrap",gap:5,border:`1px solid ${sp?P.goldD:sr?P.gold:P.border}`}}>
            <div><span style={{fontSize:13,color:P.black,fontWeight:600}}>{st.title}</span>{stu&&<span style={{...rBadge(stu.role),marginLeft:8,fontSize:10}}>{stu.avatar} {stu.firstName}</span>}</div>
            <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>

      <BtnRow onCancel={()=>setShowCerrar(false)} onConfirm={cerrarSesion} label="⏹ Cerrar sesión" color={P.goldD}/>
    </Modal>}

    {showNSub&&<Modal title="➕ Nueva Sub-tarea" onClose={()=>setShowNSub(false)}>

    </Modal>}
  </div>;
}

function AgenteIA({cur,users,clients,tasks,onCrear,onClose}){
  const[input,setInput]=useState("");
  const[loading,setLoading]=useState(false);
  const[resultado,setResultado]=useState(null);
  const[err,setErr]=useState("");
  const role=cur?.role;
  const assignTo=!cur?[]:users.filter(u=>u.id!==cur.id&&(CAN_ASSIGN_TO[role]||[]).includes(u.role));

  const analizar=async()=>{
    if(!input.trim())return;
    setLoading(true);setErr("");setResultado(null);
    const clientList=clients.map(c=>`- ID:"${c.id}" Empresa:"${c.compania}" Tipos:[${(c.tiposDevolucion||[]).join(", ")}] Periodos:[${(c.periodos||[]).join(", ")}]`).join("\n");
    const userList=assignTo.map(u=>`- ID:"${u.id}" Nombre:"${u.firstName} ${u.lastName}" Rol:${u.role}`).join("\n");
    const prompt=`Eres un asistente de gestión de tareas para Census Consultores.
Analiza la solicitud y devuelve SOLO JSON sin markdown:
{"title":"<actividad exacta>","assignedTo":"<id>","clientId":"<id>","tipoDevolucion":"<tipo>","periodo":"<periodo>","urgente":<bool>,"explicacion":"<texto>"}

ACTIVIDADES: ${TASKS_LIST.join(", ")}
CLIENTES: ${clientList||"Ninguno"}
USUARIOS: ${userList||"Ninguno"}
REGLAS: title debe ser exactamente una actividad del listado. Si no puedes identificar algo con certeza usa "".
SOLICITUD: "${input.trim()}"`;
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})});
      const data=await res.json();
      const txt=data.content?.map(c=>c.text||"").join("").trim().replace(/```json|```/g,"").trim();
      setResultado(JSON.parse(txt));
    }catch(e){setErr("No pude interpretar la solicitud. Intenta ser más específico.");}
    setLoading(false);
  };

  const cl=resultado?clients.find(c=>String(c.id)===String(resultado.clientId)):null;
  const usr=resultado?users.find(u=>String(u.id)===String(resultado.assignedTo)):null;

  return <Modal title="🤖 Agente IA — Crear Tarea" onClose={onClose} wide>
    <p style={{fontSize:13,color:P.gray,margin:"0 0 12px"}}>Describe la tarea y la IA la estructurará automáticamente.</p>
    <textarea value={input} onChange={e=>setInput(e.target.value)} placeholder='Ej: "Necesito que Daniel haga elaboración de pruebas para Empresa ABC de Enero 2025, es urgente"' style={{...iSt,height:80,resize:"vertical",marginBottom:10}}/>
    <button onClick={analizar} disabled={loading||!input.trim()} style={{width:"100%",padding:11,background:loading?"#7CC8F5":P.ai,color:P.white,border:"none",borderRadius:8,fontWeight:700,fontSize:14,cursor:loading?"not-allowed":"pointer",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
      {loading?<><div style={{width:16,height:16,border:"2px solid #fff",borderTop:"2px solid transparent",borderRadius:"50%",animation:"spin .8s linear infinite"}}></div>Analizando...</>:"✨ Analizar con IA"}
    </button>
    {err&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"8px 12px",color:P.danger,fontSize:13,marginBottom:12}}>⚠️ {err}</div>}
    {resultado&&<div style={{background:"#F0F9FF",border:`1.5px solid ${P.ai}`,borderRadius:10,padding:16,marginBottom:14}}>
      <div style={{fontSize:13,fontWeight:800,color:P.ai,marginBottom:10}}>✅ Tarea identificada</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        {[{l:"📋 Actividad",v:resultado.title||"—"},{l:"👤 Asignado a",v:usr?`${usr.avatar} ${usr.firstName} ${usr.lastName}`:"—"},{l:"🏢 Cliente",v:cl?.compania||"—"},{l:"📄 Tipo",v:resultado.tipoDevolucion||"—"},{l:"📅 Periodo",v:resultado.periodo||"—"},{l:"⚡ Urgente",v:resultado.urgente?"Sí":"No"}].map(({l,v})=><div key={l} style={{background:P.white,borderRadius:7,padding:"7px 10px",border:`1px solid ${P.border}`}}>
          <div style={{fontSize:10,fontWeight:700,color:P.goldD}}>{l}</div>
          <div style={{fontSize:12,fontWeight:600,color:P.black,marginTop:2}}>{v}</div>
        </div>)}
      </div>
      {resultado.explicacion&&<div style={{fontSize:12,color:P.gray,background:P.lightG,borderRadius:7,padding:"7px 10px",marginBottom:10}}>{resultado.explicacion}</div>}
      <BtnRow onCancel={()=>setResultado(null)} onConfirm={()=>onCrear(resultado)} label="✅ Crear tarea" color={P.black} disabled={!resultado.title||!resultado.assignedTo}/>
    </div>}
  </Modal>;
}

// ── REPORTE ────────────────────────────────────────────────────────────────
function ReporteView({tasks,projects,clients,users}){
  const[desde,setDesde]=useState("");const[hasta,setHasta]=useState("");const[res,setRes]=useState(null);
  const gC=id=>clients.find(c=>String(c.id)===String(id));
  const gU=id=>users.find(u=>String(u.id)===String(id));
  const consultar=()=>{
    const d=desde?new Date(desde+" 00:00:00"):null,h=hasta?new Date(hasta+" 23:59:59"):null,filas=[],ahora=Date.now();
    // tareas normales
    tasks.forEach(t=>{
      const fecha=t.completedAt?new Date(t.completedAt):new Date(ahora);
      if(d&&fecha<d)return;if(h&&fecha>h)return;
      const cl=gC(t.clientId),tramite=cl?`${cl.compania} | ${t.tipoDevolucion||""} | ${t.periodo||""}`:"Sin trámite";
      const persona=gU(t.assignedTo);
      const ha=t.status==="done"?(t.hours||0):msToH(t.status==="paused"||t.status==="queued"?t.activeMs:t.activeMs+(ahora-t.startedAt));
      const estado=t.status==="done"?"Completada":t.status==="paused"?"Pausada":t.status==="queued"?"En cola":"En progreso";
      filas.push({tramite,nombre:persona?.name||"—",horas:ha,actividad:t.title,tipo:"Tarea",sesionDesc:"—",observacion:t.observacion||"—",fecha:t.completedAt?new Date(t.completedAt).toLocaleDateString("es-EC"):"En curso",estado});
    });
    // proyectos — una fila por sesión
    projects.forEach(proj=>{
      const cl=gC(proj.clientId),tramite=cl?`${cl.compania} | ${proj.tipoDevolucion||""} | ${proj.periodo||""}`:"Sin trámite";
      const persona=gU(proj.assignedTo);
      (proj.sesiones||[]).filter(s=>s.status==="cerrada").forEach(s=>{
        const fecha=new Date(s.fecha);
        if(d&&fecha<d)return;if(h&&fecha>h)return;
        filas.push({tramite,nombre:persona?.name||"—",horas:msToH(s.activeMs),actividad:`🗂 ${proj.nombre}`,tipo:"Proyecto",sesionDesc:s.desc,observacion:s.obs||"—",fecha:fmtDate(s.fecha),estado:proj.status==="completado"?"Completado":"Activo"});
      });
    });
    setRes(filas);
  };
  const descargar=()=>{
    if(!res?.length)return;
    const hdrs=["Trámite","Nombre","Tipo","Actividad/Proyecto","Sesión","Horas","Observación","Fecha","Estado"];
    const rows=[hdrs,...res.map(r=>[r.tramite,r.nombre,r.tipo,r.actividad,r.sesionDesc,r.horas,r.observacion,r.fecha,r.estado])];
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=`reporte_census_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
  };
  const total=res?res.reduce((s,r)=>s+r.horas,0):0;
  return <div>
    <h2 style={{margin:"0 0 20px",color:P.black,fontSize:19,fontWeight:800}}>📊 Reporte de Horas</h2>
    <div style={{background:P.white,borderRadius:12,border:`1px solid ${P.border}`,padding:20,marginBottom:16}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
        <div><label style={{fontSize:13,fontWeight:600,color:P.dark,display:"block",marginBottom:4}}>Desde</label><input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iSt,marginBottom:0}}/></div>
        <div><label style={{fontSize:13,fontWeight:600,color:P.dark,display:"block",marginBottom:4}}>Hasta</label><input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iSt,marginBottom:0}}/></div>
      </div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={consultar} style={{flex:1,padding:11,background:P.black,color:P.gold,border:"none",borderRadius:8,fontWeight:700,cursor:"pointer"}}>🔍 Consultar</button>
        {res?.length>0&&<button onClick={descargar} style={{flex:1,padding:11,background:P.gold,color:P.black,border:"none",borderRadius:8,fontWeight:700,cursor:"pointer"}}>⬇️ Descargar CSV</button>}
      </div>
    </div>
    {res&&<div style={{background:P.white,borderRadius:12,border:`1px solid ${P.border}`,padding:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <div><div style={{fontSize:16,fontWeight:800,color:P.black}}>Resultados</div><div style={{fontSize:13,color:P.gray}}>{res.length} registro{res.length!==1?"s":""}</div></div>
        <div style={{background:P.lightG,border:`1px solid ${P.border}`,borderRadius:8,padding:"8px 16px",textAlign:"center"}}>
          <div style={{fontSize:11,fontWeight:700,color:P.goldD}}>TOTAL HORAS</div>
          <div style={{fontSize:22,fontWeight:800,color:P.black}}>{Math.round(total*100)/100}h</div>
        </div>
      </div>
      {res.length===0?<div style={{textAlign:"center",padding:40,color:P.gray}}>Sin registros.</div>
      :<div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{background:P.black}}>{["Trámite","Nombre","Tipo","Actividad","Sesión","Horas","Observación","Fecha","Estado"].map(h=><th key={h} style={{padding:"10px",textAlign:"left",fontWeight:700,color:P.gold,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
          <tbody>{res.map((r,i)=><tr key={i} style={{borderBottom:`1px solid ${P.border}44`,background:i%2===0?P.white:P.lightG}}>
            <td style={{padding:"9px 10px",fontSize:11}}><div style={{fontWeight:600}}>{r.tramite.split(" | ")[0]}</div><div style={{color:P.goldD,fontSize:10}}>{r.tramite.split(" | ")[1]}</div></td>
            <td style={{padding:"9px 10px",fontWeight:600,whiteSpace:"nowrap"}}>{r.nombre}</td>
            <td style={{padding:"9px 10px"}}><span style={{fontSize:10,padding:"2px 7px",borderRadius:99,background:r.tipo==="Proyecto"?"#CCFBF1":"#FDF6DC",color:r.tipo==="Proyecto"?P.proj:P.goldD,fontWeight:700}}>{r.tipo}</span></td>
            <td style={{padding:"9px 10px",color:P.gray}}>{r.actividad}</td>
            <td style={{padding:"9px 10px",color:P.gray,fontSize:11,maxWidth:140}}>{r.sesionDesc}</td>
            <td style={{padding:"9px 10px",fontWeight:800,color:P.goldD,whiteSpace:"nowrap"}}>{r.horas>0?`${r.horas}h`:"—"}</td>
            <td style={{padding:"9px 10px",color:P.gray,fontSize:11,maxWidth:130}}>{r.observacion}</td>
            <td style={{padding:"9px 10px",color:P.gray,fontSize:11,whiteSpace:"nowrap"}}>{r.fecha}</td>
            <td style={{padding:"9px 10px"}}><span style={{fontSize:10,fontWeight:600,padding:"2px 7px",borderRadius:99,background:r.estado==="Completada"||r.estado==="Completado"?"#DCFCE7":"#FDF6DC",color:r.estado==="Completada"||r.estado==="Completado"?P.success:P.goldD}}>{r.estado}</span></td>
          </tr>)}</tbody>
        </table>
      </div>}
    </div>}
  </div>;
}

            <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap"}}>
              <div style={{background:P.white,border:`1px solid ${P.border}`,borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:700,color:P.black}}>{sr?"🔴 ":sp?"⏸ ":""}{fmtT(sa)}</div>
              {!sd&&sr&&<button onClick={()=>{setEvNombre("");setShowEv({tid:task.id,sid:st.id});}} style={{padding:"3px 8px",background:P.danger,color:P.white,border:"none",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:11}}>📌</button>}
              {!sd&&sp&&<button onClick={()=>reanudar(task.id,st.id)} style={{padding:"3px 8px",background:P.success,color:P.white,border:"none",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:11}}>▶</button>}
              {!sd&&stA&&<button onClick={()=>iniciarComplete(task.id,st.id)} style={{padding:"4px 10px",background:P.gold,color:P.black,border:"none",borderRadius:6,fontWeight:700,cursor:"pointer",fontSize:11}}>✅</button>}
            </div>
          </div>;
        })}
      </div>}
    </div>;
  };

  return(
    <div style={{minHeight:"100vh",background:P.lightG}}>
      {/* NAVBAR */}
      <div style={{background:P.black,borderBottom:`2px solid ${P.gold}`,padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,background:`linear-gradient(135deg,${P.goldD},${P.gold})`,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>⏱️</div>
          <div><div style={{fontWeight:800,fontSize:16,color:P.gold,letterSpacing:1}}>TimeTrack Pro</div><div style={{fontSize:10,color:P.goldL,letterSpacing:2}}>CENSUS CONSULTORES</div></div>
        </div>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
          {nav.map(v=><button key={v.id} onClick={()=>setView(v.id)} style={{padding:"6px 13px",borderRadius:7,border:`1px solid ${view===v.id?P.gold:"transparent"}`,background:view===v.id?P.gold:"transparent",color:view===v.id?P.black:P.goldL,fontWeight:600,cursor:"pointer",fontSize:12}}>{v.icon} {v.label}</button>)}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{position:"relative"}}>
            <button onClick={()=>setShowNotifP(!showNotifP)} style={{width:34,height:34,borderRadius:"50%",background:"transparent",border:`1px solid ${P.gold}`,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:P.gold}}>🔔</button>
            {unread>0&&<div style={{position:"absolute",top:-3,right:-3,background:P.danger,color:P.white,borderRadius:"50%",width:17,height:17,fontSize:9,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}}>{unread}</div>}
          </div>
          <div onClick={()=>setShowAv(true)} style={{width:36,height:36,borderRadius:"50%",background:rbg(role),border:`2px solid ${P.gold}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,cursor:"pointer"}}>{cur.avatar}</div>
          <div><div style={{fontSize:13,fontWeight:700,color:P.gold}}>{cur.firstName}</div><span style={{...rBadge(role),fontSize:10}}>{rl(role)}</span></div>
          <button onClick={()=>setShowCP(true)} style={{padding:"5px 10px",borderRadius:6,border:`1px solid ${P.gold}`,background:"transparent",color:P.gold,cursor:"pointer",fontSize:12}}>🔑</button>
          <button onClick={()=>setCur(null)} style={{padding:"5px 10px",borderRadius:6,border:`1px solid ${P.goldD}`,background:"transparent",color:P.goldL,cursor:"pointer",fontSize:12}}>Salir</button>
        </div>
      </div>

      {showNotifP&&<div style={{position:"fixed",top:62,right:14,width:320,background:P.white,borderRadius:14,boxShadow:"0 8px 32px #00000033",border:`1px solid ${P.border}`,zIndex:200,maxHeight:440,display:"flex",flexDirection:"column"}}>
        <div style={{padding:"12px 14px",borderBottom:`1px solid ${P.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:P.black,borderRadius:"14px 14px 0 0"}}>
          <span style={{fontWeight:800,color:P.gold,fontSize:14}}>🔔 Notificaciones</span>
          <div style={{display:"flex",gap:8}}>
            {unread>0&&<button onClick={()=>setNotifs(notifs.map(n=>n.userId===cur.id?{...n,read:true}:n))} style={{fontSize:11,color:P.goldL,background:"transparent",border:"none",cursor:"pointer"}}>Marcar leídas</button>}
            <button onClick={()=>setShowNotifP(false)} style={{fontSize:18,background:"transparent",border:"none",cursor:"pointer",color:P.goldL}}>×</button>
          </div>
        </div>
        <div style={{overflowY:"auto",flex:1}}>
          {myN.length===0&&<div style={{padding:28,textAlign:"center",color:P.gray,fontSize:13}}>Sin notificaciones</div>}
          {myN.map(n=><div key={n.id} style={{padding:"10px 14px",borderBottom:`1px solid ${P.border}22`,background:n.read?P.white:P.lightG,display:"flex",gap:8,alignItems:"flex-start"}}>
            <div style={{width:30,height:30,borderRadius:"50%",background:P.lightG,border:`1px solid ${P.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>{n.tipo==="nueva"?"🆕":"⏰"}</div>
            <div style={{flex:1}}><div style={{fontSize:12,color:P.black,fontWeight:n.read?400:700}}>{n.msg}</div><div style={{fontSize:11,color:P.gray,marginTop:2}}>📋 {n.taskTitle}</div></div>
            <button onClick={()=>setNotifs(notifs.filter(x=>x.id!==n.id))} style={{background:"transparent",border:"none",color:P.gray,cursor:"pointer",fontSize:14}}>×</button>
          </div>)}
        </div>
      </div>}

      <div style={{padding:20,maxWidth:1200,margin:"0 auto"}}>

        {/* ── TABLERO ── */}
        {view==="board"&&(()=>{
          const all=sortedTasks();
          const splitView=isC||isSr||isSs;
          const myProjs=myProjects();
          const allMySubs=mySubtasks();

          // Mis tareas: tareas asignadas a mí + sub-tareas asignadas a mí
          const tareasPorHacer=splitView
            ?[...all.filter(t=>String(t.assignedTo)===String(cur.id)),
               ...allMySubs.filter(st=>String(st.assignedTo)===String(cur.id))]
            :[...all,...allMySubs.filter(st=>String(st.assignedTo)===String(cur.id))];

          // Tareas asignadas: tareas que yo asigné a otros + sub-tareas que yo asigné a otros
          const tareasAsignadas=splitView
            ?[...all.filter(t=>String(t.assignedBy)===String(cur.id)&&String(t.assignedTo)!==String(cur.id)),
               ...allMySubs.filter(st=>String(st.assignedBy)===String(cur.id)&&String(st.assignedTo)!==String(cur.id))]
            :[];
          // proyectos propios (solo Sr/SemSr los ven en su columna)
          const misProyectos=(isSr||isSs)?myProjs.filter(p=>String(p.assignedTo)===String(cur.id)):[];
          const proyectosAsignados=canAssignProjects?myProjs.filter(p=>String(p.assignedBy)===String(cur.id)&&(isJ||isC)):[];

          return <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,flexWrap:"wrap",gap:8}}>
              <h2 style={{margin:0,color:P.black,fontSize:19,fontWeight:800}}>📋 Tablero de Tareas</h2>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {isC&&<button onClick={()=>setShowActMgr(true)} style={{padding:"9px 14px",background:"#F0F9FF",color:"#0369A1",border:`1px solid ${P.ai}`,borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>⚙️ Actividades</button>}
                {canAssignProjects&&<button onClick={()=>setShowNProy(true)} style={{padding:"9px 16px",background:P.proj,color:P.white,border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>🗂 Nuevo Proyecto</button>}
                {canAssign&&<button onClick={()=>setShowNT(true)} style={{padding:"9px 20px",background:P.black,color:P.gold,border:`1px solid ${P.gold}`,borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>+ Nueva Tarea</button>}
              </div>
            </div>

            {splitView?(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,alignItems:"start"}}>
                {/* COLUMNA IZQUIERDA: mis tareas + mis proyectos */}
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:8,borderBottom:`2px solid ${P.gold}`}}>
                    <span style={{fontSize:16}}>📥</span>
                    <span style={{fontWeight:800,color:P.black,fontSize:15}}>Mis tareas</span>
                    <span style={{background:P.gold,color:P.black,borderRadius:99,fontWeight:800,fontSize:11,padding:"1px 8px",marginLeft:"auto"}}>{tareasPorHacer.length+misProyectos.length}</span>
                  </div>
                  {/* proyectos asignados a este usuario */}
                  {misProyectos.map(p=><ProyectoCard key={p.id} proj={p} cur={cur} users={users} clients={clients} onUpdate={()=>{}} onDelete={id=>fbDel("projects",id)}/>)}
                  {tareasPorHacer.length===0&&misProyectos.length===0&&<div style={{textAlign:"center",padding:40,color:P.gray,fontSize:13,background:P.white,borderRadius:10,border:`1px dashed ${P.border}`}}>Sin asignaciones pendientes</div>}
                  {tareasPorHacer.map(renderTask)}
                </div>
                {/* COLUMNA DERECHA: tareas asignadas + proyectos asignados por este usuario */}
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:8,borderBottom:`2px solid ${P.proj}`}}>
                    <span style={{fontSize:16}}>📤</span>
                    <span style={{fontWeight:800,color:P.black,fontSize:15}}>Tareas asignadas</span>
                    <span style={{background:P.proj,color:P.white,borderRadius:99,fontWeight:800,fontSize:11,padding:"1px 8px",marginLeft:"auto"}}>{tareasAsignadas.length+proyectosAsignados.length}</span>
                  </div>
                  {proyectosAsignados.map(p=><ProyectoCard key={p.id} proj={p} cur={cur} users={users} clients={clients} onUpdate={()=>{}} onDelete={id=>fbDel("projects",id)}/>)}
                  {tareasAsignadas.length===0&&proyectosAsignados.length===0&&<div style={{textAlign:"center",padding:40,color:P.gray,fontSize:13,background:P.white,borderRadius:10,border:`1px dashed ${P.border}`}}>No has asignado tareas aún</div>}
                  {tareasAsignadas.map(renderTask)}
                </div>
              </div>
            ):(
              <>
                {/* Vista Jefe/Coordinador: tareas + todos los proyectos */}
                {(isJ||isC)&&myProjs.length>0&&<>
                  <div style={{fontSize:13,fontWeight:700,color:P.proj,marginBottom:10,display:"flex",alignItems:"center",gap:6}}>🗂 Proyectos activos <span style={{background:"#CCFBF1",color:P.proj,borderRadius:99,fontSize:11,padding:"1px 8px",fontWeight:800}}>{myProjs.length}</span></div>
                  {myProjs.map(p=><ProyectoCard key={p.id} proj={p} cur={cur} users={users} clients={clients} onUpdate={()=>{}} onDelete={id=>fbDel("projects",id)}/>)}
                  {tareasPorHacer.length>0&&<div style={{fontSize:13,fontWeight:700,color:P.goldD,margin:"16px 0 10px",display:"flex",alignItems:"center",gap:6}}>📋 Tareas <span style={{background:P.lightG,color:P.goldD,borderRadius:99,fontSize:11,padding:"1px 8px",fontWeight:800,border:`1px solid ${P.border}`}}>{tareasPorHacer.length}</span></div>}
                </>}
                {tareasPorHacer.length===0&&myProjs.length===0&&<div style={{textAlign:"center",padding:60,color:P.gray}}>No hay tareas ni proyectos aún.</div>}
                {tareasPorHacer.map(renderTask)}
              </>
            )}
          </>;
        })()}

        {/* ── CLIENTES ── */}
        {view==="clients"&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:8}}>
            <h2 style={{margin:0,color:P.black,fontSize:19,fontWeight:800}}>🏢 Clientes</h2>
            {canClients&&<button onClick={openNC} style={{padding:"8px 18px",background:P.black,color:P.gold,border:`1px solid ${P.gold}`,borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>+ Nuevo Cliente</button>}
          </div>
          {!canClients&&!canAddPeriodos&&<div style={{background:"#FFF8E7",border:`1px solid ${P.border}`,borderRadius:10,padding:12,color:P.goldD,fontSize:13,marginBottom:14}}>Solo Jefe y Coordinador pueden gestionar clientes.</div>}
          {!canClients&&canAddPeriodos&&<div style={{background:"#F0F9FF",border:`1px solid ${P.ai}`,borderRadius:10,padding:12,color:"#0369A1",fontSize:13,marginBottom:14}}>📅 Puedes agregar periodos a los clientes existentes.</div>}
          {clients.length===0&&<div style={{textAlign:"center",padding:40,color:P.gray}}>No hay clientes aún.</div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:14}}>
            {clients.map(cl=><div key={cl.id} style={{background:P.white,borderRadius:12,border:`1.5px solid ${P.border}`,padding:18}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                <div style={{display:"flex",gap:10,alignItems:"center"}}>
                  <div style={{width:42,height:42,borderRadius:10,background:P.lightG,border:`1px solid ${P.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🏢</div>
                  <div style={{fontWeight:800,color:P.black,fontSize:14}}>{cl.compania}</div>
                </div>
                <div style={{display:"flex",gap:4}}>
                  {canClients&&<><button onClick={()=>openEC(cl)} style={{padding:"4px 8px",background:P.lightG,border:`1px solid ${P.border}`,borderRadius:6,cursor:"pointer"}}>✏️</button>
                  <button onClick={()=>fbDel("clients",cl.id)} style={{padding:"4px 8px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:6,cursor:"pointer"}}>🗑️</button></>}
                  {!canClients&&canAddPeriodos&&<button onClick={()=>openEC(cl)} style={{padding:"4px 10px",background:"#F0F9FF",border:`1px solid ${P.ai}`,borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:700,color:"#0369A1"}}>📅 +Periodo</button>}
                </div>
              </div>
              <div style={{fontSize:11,fontWeight:700,color:P.goldD,marginBottom:6,letterSpacing:1}}>TIPOS DE DEVOLUCIÓN</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>{(cl.tiposDevolucion||[]).map((td,i)=><span key={i} style={{fontSize:10,background:"#D6E8F7",color:"#1A4A7A",padding:"2px 8px",borderRadius:99,fontWeight:600}}>{td}</span>)}</div>
              <div style={{fontSize:11,fontWeight:700,color:P.goldD,marginBottom:5,letterSpacing:1}}>PERIODOS</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {!(cl.periodos||[]).length&&<span style={{fontSize:12,color:P.gray}}>Sin periodos</span>}
                {(cl.periodos||[]).map((p,i)=><span key={i} style={{fontSize:11,background:P.lightG,color:P.goldD,padding:"2px 9px",borderRadius:99,fontWeight:600,border:`1px solid ${P.border}`}}>📅 {p}</span>)}
              </div>
            </div>)}
          </div>
        </>}

        {/* ── COLABORADORES ── */}
        {view==="colabs"&&<>
          <h2 style={{margin:"0 0 18px",color:P.black,fontSize:19,fontWeight:800}}>👥 Colaboradores</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
            {users.map(c=>{
              const pe=tasks.filter(t=>String(t.assignedTo)===String(c.id)&&t.status==="inprogress").length;
              const pa=tasks.filter(t=>String(t.assignedTo)===String(c.id)&&t.status==="paused").length;
              const pq=tasks.filter(t=>String(t.assignedTo)===String(c.id)&&t.status==="queued").length;
              const pp=projects.filter(p=>String(p.assignedTo)===String(c.id)&&p.status!=="completado").length;
              return <div key={c.id} style={{background:P.white,borderRadius:12,border:`1.5px solid ${P.border}`,padding:16}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <div style={{width:40,height:40,borderRadius:"50%",background:rbg(c.role),border:`2px solid ${P.gold}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>{c.avatar}</div>
                    <div><div style={{fontWeight:700,color:P.black,fontSize:13}}>{c.name}</div><span style={{...rBadge(c.role),fontSize:10}}>{rl(c.role)}</span></div>
                  </div>
                  {isJ&&<button onClick={()=>setEditColab(c)} style={{padding:"4px 9px",background:P.lightG,border:`1px solid ${P.border}`,borderRadius:7,cursor:"pointer",fontSize:12}}>✏️</button>}
                </div>
                <div style={{fontSize:12,color:P.gray,marginBottom:8}}>✉️ <a href={`mailto:${c.email}`} style={{color:P.goldD,textDecoration:"none"}}>{c.email}</a></div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {pe>0&&<span style={{fontSize:10,background:P.lightG,color:P.goldD,padding:"2px 7px",borderRadius:99,fontWeight:600,border:`1px solid ${P.border}`}}>▶ {pe}</span>}
                  {pa>0&&<span style={{fontSize:10,background:"#FFF0CC",color:P.goldD,padding:"2px 7px",borderRadius:99,fontWeight:600}}>⏸ {pa}</span>}
                  {pq>0&&<span style={{fontSize:10,background:"#EDE9FE",color:P.urgent,padding:"2px 7px",borderRadius:99,fontWeight:600}}>⏳ {pq}</span>}
                  {pp>0&&<span style={{fontSize:10,background:"#CCFBF1",color:P.proj,padding:"2px 7px",borderRadius:99,fontWeight:600}}>🗂 {pp} proy</span>}
                </div>
              </div>;
            })}
          </div>
        </>}

        {view==="report"&&<ReporteView tasks={tasks} projects={projects} clients={clients} users={users}/>}

        {view==="team"&&isJ&&<>
          <h2 style={{margin:"0 0 18px",color:P.black,fontSize:19,fontWeight:800}}>🏠 Vista del Equipo</h2>
          {ROLE_ORDER.filter(r=>r!=="jefe").map(r=>{
            const ms=users.filter(u=>u.role===r);if(!ms.length)return null;
            return <div key={r} style={{marginBottom:22}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={rBadge(r)}>{rl(r)}</span><span style={{fontSize:12,color:P.gray}}>{ms.length} miembro{ms.length>1?"s":""}</span></div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
                {ms.map(u=>{
                  const ut=tasks.filter(t=>String(t.assignedTo)===String(u.id));
                  const up=projects.filter(p=>String(p.assignedTo)===String(u.id));
                  const d=ut.filter(t=>t.status==="done").length,a=ut.filter(t=>t.status==="inprogress").length,p=ut.filter(t=>t.status==="paused").length,q=ut.filter(t=>t.status==="queued").length;
                  const th=ut.reduce((s,t)=>s+(t.hours||0),0);
                  const thP=up.reduce((s,pr)=>s+(pr.sesiones||[]).reduce((ss,se)=>ss+msToH(se.activeMs),0),0);
                  return <div key={u.id} style={{background:P.white,borderRadius:12,border:`1.5px solid ${P.border}`,padding:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                      <div style={{width:34,height:34,borderRadius:"50%",background:rbg(u.role),border:`2px solid ${P.gold}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{u.avatar}</div>
                      <div style={{fontWeight:700,color:P.black,fontSize:12}}>{u.firstName} {u.lastName}</div>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
                      {[{l:"▶",v:a,col:P.gold},{l:"⏸",v:p,col:P.goldD},{l:"⏳",v:q,col:P.urgent},{l:"✅",v:d,col:P.success},{l:"⏱ Tareas",v:`${th}h`,col:P.black},{l:"🗂 Proyectos",v:`${Math.round(thP*100)/100}h`,col:P.proj}].map(({l,v,col})=><div key={l} style={{background:P.lightG,borderRadius:6,padding:"5px 6px",textAlign:"center",border:`1px solid ${P.border}44`}}>
                        <div style={{fontSize:9,color:P.gray}}>{l}</div><div style={{fontSize:12,fontWeight:800,color:col}}>{v}</div>
                      </div>)}
                    </div>
                  </div>;
                })}
              </div>
            </div>;
          })}
        </>}
      </div>

      {/* ── MODALES ── */}
      {showDel&&(()=>{const t=tasks.find(t=>String(t.id)===String(showDel));return <Modal title="🗑️ Eliminar Tarea" onClose={()=>setShowDel(null)}>
        <p style={{fontSize:14,color:P.dark,margin:"0 0 10px"}}>¿Eliminar esta tarea permanentemente?</p>
        <div style={{background:P.lightG,border:`1px solid ${P.border}`,borderRadius:8,padding:"10px 14px",marginBottom:12}}><span style={{fontWeight:700,color:P.black}}>{t?.title}</span></div>
        <p style={{fontSize:12,color:P.danger,margin:"0 0 16px"}}>⚠️ Esta acción no se puede deshacer.</p>
        <BtnRow onCancel={()=>setShowDel(null)} onConfirm={eliminarTarea} label="Sí, eliminar" color={P.danger}/>
      </Modal>;})()}

      {showEv&&<Modal title="📌 Evento No Relacionado" onClose={()=>setShowEv(null)}>
        <p style={{fontSize:13,color:P.gray,margin:"0 0 12px"}}>Indica el nombre del evento externo:</p>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Nombre del evento *</label>
        <input value={evNombre} onChange={e=>setEvNombre(e.target.value)} onKeyDown={e=>e.key==="Enter"&&confirmarEv()} placeholder="Ej: Reunión administrativa..." style={iSt} autoFocus/>
        <BtnRow onCancel={()=>setShowEv(null)} onConfirm={confirmarEv} label="📌 Registrar y pausar" color={P.danger} disabled={!evNombre.trim()}/>
      </Modal>}

      {showObs&&(()=>{
        const t=tasks.find(t=>String(t.id)===String(showObs.tid));
        const st=showObs.sid?t?.subtasks?.find(s=>String(s.id)===String(showObs.sid)):null;
        const item=st||t,ms=item?liveMs(item):0;
        return <Modal title="✅ Completar Tarea" onClose={()=>setShowObs(null)}>
          <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Observación <span style={{fontWeight:400,color:P.gray}}>(opcional)</span></label>
          <textarea value={obsT} onChange={e=>setObsT(e.target.value)} placeholder="Ej: Se encontraron diferencias..." style={{...iSt,height:80,resize:"vertical"}}/>
          <div style={{background:P.lightG,border:`1.5px solid ${P.gold}`,borderRadius:10,padding:12,marginBottom:14,textAlign:"center"}}>
            <div style={{fontSize:11,fontWeight:700,color:P.goldD}}>TIEMPO ACTIVO</div>
            <div style={{fontSize:22,fontWeight:800,color:P.black}}>{fmtT(ms)}</div>
            <div style={{fontSize:12,color:P.gray}}>≈ {msToH(ms)}h se registrarán</div>
          </div>
          <BtnRow onCancel={()=>setShowObs(null)} onConfirm={doComplete} label="✅ Confirmar" color={P.gold}/>
        </Modal>;
      })()}

      {showCP&&<Modal title="🔑 Cambiar Contraseña" onClose={()=>{setShowCP(false);setPErr("");setPf({current:"",nuevo:"",confirm:""});}}>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Actual</label><input value={pf.current} onChange={e=>setPf({...pf,current:e.target.value})} type="password" style={iSt}/>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Nueva</label><input value={pf.nuevo} onChange={e=>setPf({...pf,nuevo:e.target.value})} type="password" style={iSt}/>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Confirmar</label><input value={pf.confirm} onChange={e=>setPf({...pf,confirm:e.target.value})} type="password" style={iSt}/>
        {pErr&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"8px 12px",color:P.danger,fontSize:13,marginBottom:10}}>⚠️ {pErr}</div>}
        {pOk&&<div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:8,padding:"8px 12px",color:P.success,fontSize:13,marginBottom:10}}>✅ ¡Actualizada!</div>}
        <BtnRow onCancel={()=>{setShowCP(false);setPErr("");setPf({current:"",nuevo:"",confirm:""}); }} onConfirm={savePass} label="Guardar" color={P.black}/>
      </Modal>}

      {showCF&&<Modal title={editCl?(canClients?"✏️ Editar Cliente":"📅 Agregar Periodo"):"🏢 Nuevo Cliente"} onClose={()=>setShowCF(false)}>
        {canClients&&<><label style={{fontSize:13,fontWeight:600,color:P.dark}}>Compañía</label>
        <input value={clf.compania} onChange={e=>setClf({...clf,compania:e.target.value})} style={iSt}/>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Tipos de Devolución</label>
        <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:6,marginBottom:12,maxHeight:200,overflowY:"auto",padding:8,border:`1px solid ${P.border}`,borderRadius:7,background:P.lightG}}>
          {TIPOS_DEVOLUCION.map(td=><label key={td} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:P.dark,padding:"4px 6px",borderRadius:6,background:clf.tiposDevolucion.includes(td)?P.white:"transparent"}}>
            <input type="checkbox" checked={clf.tiposDevolucion.includes(td)} onChange={()=>toggleTipoDevolucion(td)} style={{accentColor:P.goldD,width:14,height:14}}/>{td}
          </label>)}
        </div>
        {clf.tiposDevolucion.length===0&&<p style={{fontSize:11,color:P.danger,margin:"-8px 0 10px"}}>* Selecciona al menos uno</p>}</>}
        {!canClients&&canAddPeriodos&&editCl&&<div style={{background:"#F0F9FF",border:`1px solid ${P.ai}`,borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:"#0369A1"}}>📋 <strong>{clf.compania}</strong> — solo puedes agregar periodos.</div>}
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Periodos</label>
        {clf.periodos.map((p,i)=><div key={i} style={{display:"flex",gap:6,marginTop:4,marginBottom:6}}>
          <input value={p} onChange={e=>{const ps=[...clf.periodos];ps[i]=e.target.value;setClf({...clf,periodos:ps});}} placeholder="Ej: Enero 2025" style={{...iSt,marginTop:0,marginBottom:0,flex:1}}/>
          {canClients&&clf.periodos.length>1&&<button onClick={()=>setClf({...clf,periodos:clf.periodos.filter((_,idx)=>idx!==i)})} style={{padding:"0 10px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:7,cursor:"pointer",color:P.danger,fontWeight:700,fontSize:16}}>×</button>}
        </div>)}
        <button onClick={()=>setClf({...clf,periodos:[...clf.periodos,""]})} style={{width:"100%",padding:7,border:`1.5px dashed ${P.border}`,borderRadius:7,background:"transparent",color:P.gray,cursor:"pointer",fontSize:13,marginBottom:14,fontWeight:600}}>+ Agregar periodo</button>
        <BtnRow onCancel={()=>setShowCF(false)} onConfirm={saveCl} label={editCl?"Guardar":"Crear"} color={P.black}/>
      </Modal>}

      {showNT&&<Modal title="📋 Nueva Tarea" onClose={()=>setShowNT(false)}>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Actividad</label>
        <select value={nt.title} onChange={e=>setNt({...nt,title:e.target.value})} style={iSt}>
          <option value="">Selecciona actividad...</option>
          {TASKS_LIST.map(t=><option key={t} value={t}>{t}</option>)}
          {customActivities.map(t=><option key={t} value={t}>✨ {t}</option>)}
        </select>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Asignar a</label>
        <select value={nt.assignedTo} onChange={e=>setNt({...nt,assignedTo:e.target.value})} style={iSt}>
          <option value="">Selecciona persona...</option>
          {assignTo.map(u=><option key={u.id} value={u.id}>{u.avatar} {u.firstName} {u.lastName} — {rl(u.role)}</option>)}
        </select>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Cliente</label>
        <select value={nt.clientId} onChange={e=>setNt({...nt,clientId:e.target.value,tipoDevolucion:"",periodo:""})} style={iSt}>
          <option value="">Selecciona cliente...</option>
          {clients.map(c=><option key={c.id} value={c.id}>{c.compania}</option>)}
        </select>
        {nt.clientId&&<>
          <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Tipo de Devolución</label>
          <select value={nt.tipoDevolucion} onChange={e=>setNt({...nt,tipoDevolucion:e.target.value})} style={iSt}>
            <option value="">Selecciona tipo...</option>
            {(clients.find(c=>String(c.id)===String(nt.clientId))?.tiposDevolucion||[]).map(td=><option key={td} value={td}>{td}</option>)}
          </select>
          <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Periodo</label>
          <select value={nt.periodo} onChange={e=>setNt({...nt,periodo:e.target.value})} style={iSt}>
            <option value="">Selecciona periodo...</option>
            {(clients.find(c=>String(c.id)===String(nt.clientId))?.periodos||[]).map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        </>}
        <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",marginBottom:12,fontSize:13,fontWeight:600,color:P.urgent}}>
          <input type="checkbox" checked={nt.urgente} onChange={e=>setNt({...nt,urgente:e.target.checked})} style={{accentColor:P.urgent,width:15,height:15}}/>
          ⚡ Marcar como URGENTE
        </label>
        {hasActiveTask(nt.assignedTo)&&nt.assignedTo&&!nt.urgente&&<div style={{background:"#EDE9FE",border:`1px solid ${P.urgent}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:P.urgent}}>⏳ Quedará en cola.</div>}
        {hasActiveTask(nt.assignedTo)&&nt.assignedTo&&nt.urgente&&<div style={{background:"#FEF2F2",border:`1px solid ${P.danger}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:P.danger}}>⚡ La tarea actual se pausará.</div>}
        <BtnRow onCancel={()=>setShowNT(false)} onConfirm={()=>addTask(null)} label="Crear tarea" color={P.black} disabled={!nt.title||!nt.assignedTo}/>
      </Modal>}

      {showST&&<Modal title="➕ Sub-tarea" onClose={()=>setShowST(null)}>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Actividad</label>
        <select value={nst.title} onChange={e=>setNst({...nst,title:e.target.value})} style={iSt}>
          <option value="">Selecciona actividad...</option>
          {allActivities.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Asignar a</label>
        <select value={nst.assignedTo} onChange={e=>setNst({...nst,assignedTo:e.target.value})} style={iSt}>
          <option value="">Selecciona persona...</option>
          {subTo.map(u=><option key={u.id} value={u.id}>{u.avatar} {u.firstName} {u.lastName} — {rl(u.role)}</option>)}
        </select>
        <BtnRow onCancel={()=>setShowST(null)} onConfirm={()=>addSub(showST)} label="Asignar" color={P.black} disabled={!nst.title||!nst.assignedTo}/>
      </Modal>}

      {/* NUEVO PROYECTO */}
      {showNProy&&<Modal title="🗂 Nuevo Proyecto" onClose={()=>setShowNProy(false)}>
        <div style={{background:"#F0FDFA",border:`1px solid #99F6E4`,borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:P.proj}}>🗂 Los proyectos se asignan a Senior o Semi Senior y se gestionan por sesiones de trabajo.</div>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Nombre del proyecto</label>
        <input value={nproy.nombre} onChange={e=>setNproy({...nproy,nombre:e.target.value})} placeholder="Ej: Auditoría Q1 Empresa ABC" style={iSt}/>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Asignar a</label>
        <select value={nproy.assignedTo} onChange={e=>setNproy({...nproy,assignedTo:e.target.value})} style={iSt}>
          <option value="">Selecciona Senior / Semi Senior...</option>
          {projAssignTo.map(u=><option key={u.id} value={u.id}>{u.avatar} {u.firstName} {u.lastName} — {rl(u.role)}</option>)}
        </select>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Cliente</label>
        <select value={nproy.clientId} onChange={e=>setNproy({...nproy,clientId:e.target.value,tipoDevolucion:"",periodo:""})} style={iSt}>
          <option value="">Selecciona cliente...</option>
          {clients.map(c=><option key={c.id} value={c.id}>{c.compania}</option>)}
        </select>
        {nproy.clientId&&<>
          <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Tipo de Devolución</label>
          <select value={nproy.tipoDevolucion} onChange={e=>setNproy({...nproy,tipoDevolucion:e.target.value})} style={iSt}>
            <option value="">Selecciona tipo...</option>
            {(clients.find(c=>String(c.id)===String(nproy.clientId))?.tiposDevolucion||[]).map(td=><option key={td} value={td}>{td}</option>)}
          </select>
          <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Periodo</label>
          <select value={nproy.periodo} onChange={e=>setNproy({...nproy,periodo:e.target.value})} style={iSt}>
            <option value="">Selecciona periodo...</option>
            {(clients.find(c=>String(c.id)===String(nproy.clientId))?.periodos||[]).map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        </>}
        <BtnRow onCancel={()=>setShowNProy(false)} onConfirm={addProyecto} label="🗂 Crear proyecto" color={P.proj} disabled={!nproy.nombre.trim()||!nproy.assignedTo||!nproy.clientId}/>
      </Modal>}

      {showAv&&<Modal title="🎨 Elige tu Avatar" onClose={()=>setShowAv(false)}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:7,marginBottom:14}}>
          {AVATARS.map(a=><div key={a} onClick={()=>selAv(a)} style={{fontSize:26,textAlign:"center",padding:7,borderRadius:9,cursor:"pointer",background:cur.avatar===a?P.lightG:P.white,border:`2px solid ${cur.avatar===a?P.gold:P.border}`}}>{a}</div>)}
        </div>
      </Modal>}

      {editColab&&<EditColabModal user={editColab} onSave={saveColab} onClose={()=>setEditColab(null)}/>}

      {showNoUrgente&&<Modal title="⚡ Sin tareas urgentes" onClose={()=>setShowNoUrgente(false)}>
        <div style={{textAlign:"center",padding:"20px 10px"}}>
          <div style={{fontSize:52,marginBottom:14}}>💪</div>
          <p style={{fontSize:16,fontWeight:700,color:P.black,margin:"0 0 10px"}}>No tienes tareas urgentes en cola</p>
          <p style={{fontSize:14,color:P.gray,margin:"0 0 24px",lineHeight:1.5}}>¡Vamos, que seguro falta poco para que termines tu asignación!</p>
          <button onClick={()=>setShowNoUrgente(false)} style={{padding:"10px 32px",background:P.gold,color:P.black,border:"none",borderRadius:8,fontWeight:700,fontSize:14,cursor:"pointer"}}>¡A seguir! 🚀</button>
        </div>
      </Modal>}

      {showActMgr&&<Modal title="⚙️ Gestionar Actividades" onClose={()=>setShowActMgr(false)}>
        <p style={{fontSize:13,color:P.gray,margin:"0 0 10px"}}>Actividades base (no editables):</p>
        <div style={{background:P.lightG,borderRadius:8,padding:"8px 10px",marginBottom:16,border:`1px solid ${P.border}`}}>
          {TASKS_LIST.map((a,i)=><div key={i} style={{fontSize:12,color:P.gray,padding:"3px 0",borderBottom:i<TASKS_LIST.length-1?`1px solid ${P.border}22`:"none"}}>• {a}</div>)}
        </div>
        <p style={{fontSize:13,fontWeight:700,color:P.dark,margin:"0 0 8px"}}>✨ Actividades personalizadas:</p>
        {customActivities.length===0&&<div style={{fontSize:12,color:P.gray,marginBottom:10,fontStyle:"italic"}}>Ninguna aún.</div>}
        {customActivities.map((a,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",background:P.white,borderRadius:7,marginBottom:5,border:`1px solid ${P.border}`}}>
          <span style={{fontSize:13}}>✨ {a}</span>
          <button onClick={()=>deleteActivity(a)} style={{padding:"3px 8px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:6,cursor:"pointer",color:P.danger,fontWeight:700,fontSize:12}}>🗑️</button>
        </div>)}
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <input value={newAct} onChange={e=>setNewAct(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveActivity()} placeholder="Nueva actividad..." style={{...iSt,marginTop:0,marginBottom:0,flex:1}}/>
          <button onClick={saveActivity} disabled={!newAct.trim()||allActivities.includes(newAct.trim())} style={{padding:"9px 16px",background:P.black,color:P.gold,border:"none",borderRadius:7,fontWeight:700,cursor:"pointer",flexShrink:0,opacity:(!newAct.trim()||allActivities.includes(newAct.trim()))?0.5:1}}>+ Agregar</button>
        </div>
      </Modal>}

      {showAI&&<AgenteIA cur={cur} users={users} clients={clients} tasks={tasks} onCrear={addTask} onClose={()=>setShowAI(false)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
