const ts=()=>Date.now();
const msToH=ms=>Math.round((ms/3600000)*100)/100;

const fmtDate=ms=>new Date(ms).toLocaleDateString("es-EC",{day:"2-digit",month:"short",year:"numeric"});
const mkTask=o=>({id:"t"+ts(),status:"inprogress",startedAt:ts(),pausedAt:null,activeMs:0,completedAt:null,hours:null,autopaused:false,observacion:null,eventoNombre:null,urgente:false,parentId:null,parentTitle:null,extendedMs:0,...o});
const liveMs=i=>(i.status==="done"||i.status==="paused"||i.status==="queued")?i.activeMs:i.activeMs+(ts()-i.startedAt);
const isWorkHour=()=>{const t=new Date().getHours()*60+new Date().getMinutes();return t>=540&&t<1050;};

  const sesionActiva=sesiones.find(s=>s.status==="activa");
  const totalMs=sesiones.reduce((acc,s)=>acc+(s.status==="activa"?s.activeMs+(ts()-s.startedAt):s.activeMs),0);
  const subTo=users.filter(u=>u.role==="junior");
  const isOwner=String(proj.assignedTo)===String(cur.id);
  const isCompletado=proj.status==="completado";

  const iniciarSesion=async()=>{
    if(!descSesion.trim())return;
    const nueva={id:"s"+ts(),desc:descSesion.trim(),startedAt:ts(),activeMs:0,status:"activa",fecha:ts()};
    await fbSet("projects",proj.id,{...proj,sesiones:[...sesiones,nueva],status:"activo"});
    setDescSesion("");setShowIniciar(false);
  };
  const cerrarSesion=async()=>{
    if(!sesionActiva)return;
    const ms=sesionActiva.activeMs+(ts()-sesionActiva.startedAt);
    const upd=sesiones.map(s=>s.id===sesionActiva.id?{...s,status:"cerrada",activeMs:ms,cerradaAt:ts(),obs:obsSesion.trim()||null}:s);
    await fbSet("projects",proj.id,{...proj,sesiones:upd});
    setObsSesion("");setShowCerrar(false);
  };
  const completarProyecto=async()=>{
    let upd=sesiones;
    if(sesionActiva){const ms=sesionActiva.activeMs+(ts()-sesionActiva.startedAt);upd=sesiones.map(s=>s.id===sesionActiva.id?{...s,status:"cerrada",activeMs:ms,cerradaAt:ts()}:s);}
    await fbSet("projects",proj.id,{...proj,sesiones:upd,status:"completado",completadoAt:ts(),totalHoras:msToH(totalMs)});
  };
  const addSubtask=async()=>{
    if(!nst.title||!nst.assignedTo)return;
    const st=mkTask({title:nst.title,assignedTo:nst.assignedTo,assignedBy:cur.id,parentId:proj.id,parentTitle:proj.nombre,clientId:proj.clientId,tipoDevolucion:proj.tipoDevolucion,periodo:proj.periodo});

          {sesionActiva&&<span style={{background:"#CCFBF1",color:P.proj,fontSize:10,padding:"2px 8px",borderRadius:99,fontWeight:700}}>🟢 Sesión activa</span>}

        <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>

          {proj.tipoDevolucion&&<span style={{fontSize:11,color:"#1A4A7A",background:"#D6E8F7",padding:"2px 8px",borderRadius:99}}>📋 {proj.tipoDevolucion}</span>}
          {proj.periodo&&<span style={{fontSize:11,color:P.gray,background:P.lightG,padding:"2px 8px",borderRadius:99}}>📅 {proj.periodo}</span>}
          {asignador&&<span style={{fontSize:11,color:P.gray}}>por {asignador.firstName}</span>}
          <span style={{fontSize:11,color:P.gray}}>📁 {sesiones.length} sesión{sesiones.length!==1?"es":""}</span>
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
        <div style={{background:sesionActiva?"#CCFBF1":P.lightG,border:`1.5px solid ${sesionActiva?P.proj:P.border}`,borderRadius:8,padding:"6px 14px",textAlign:"center",minWidth:120}}>
          <div style={{fontSize:10,fontWeight:700,color:P.proj}}>⏱ TOTAL</div>
          <div style={{fontSize:15,fontWeight:800,color:P.black,fontVariantNumeric:"tabular-nums"}}>{fmtT(totalMs)}</div>
          <div style={{fontSize:10,color:P.gray}}>≈ {msToH(totalMs)}h</div>
        </div>
        {!isCompletado&&isOwner&&<div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
          {!sesionActiva&&<button onClick={()=>setShowIniciar(true)} style={{padding:"6px 12px",background:P.proj,color:P.white,border:"none",borderRadius:7,fontWeight:700,cursor:"pointer",fontSize:12}}>▶ Iniciar sesión</button>}

function ReporteView({tasks,projects,clients,users}){
  const[desde,setDesde]=useState("");const[hasta,setHasta]=useState("");const[res,setRes]=useState(null);
  const gC=id=>clients.find(c=>String(c.id)===String(id));
  const gU=id=>users.find(u=>String(u.id)===String(id));
  const consultar=()=>{
    const d=desde?new Date(desde+" 00:00:00"):null,h=hasta?new Date(hasta+" 23:59:59"):null,filas=[],ahora=Date.now();
    tasks.forEach(t=>{
      const fecha=t.completedAt?new Date(t.completedAt):new Date(ahora);
      if(d&&fecha<d)return;if(h&&fecha>h)return;
      const cl=gC(t.clientId);
      const tramite=cl?`${cl.compania} | ${t.tipoDevolucion||""} | ${t.periodo||""}`:"Sin trámite";
      const persona=gU(t.assignedTo);
      const ha=t.status==="done"?(t.hours||0):msToH(t.status==="paused"||t.status==="queued"?t.activeMs:t.activeMs+(ahora-t.startedAt));
      const estado=t.status==="done"?"Completada":t.status==="paused"?"Pausada":t.status==="queued"?"En cola":"En progreso";
      const tipo=t.parentId?"Sub-tarea":"Tarea";
      const hExt=msToH(t.extendedMs||0);
      filas.push({tramite,nombre:persona?.name||"—",horas:ha,hExt,actividad:t.title,tipo,padre:t.parentTitle||"—",observacion:t.observacion||"—",fecha:t.completedAt?new Date(t.completedAt).toLocaleDateString("es-EC"):"En curso",estado});
    });
    projects.forEach(proj=>{
      const cl=gC(proj.clientId);
      const tramite=cl?`${cl.compania} | ${proj.tipoDevolucion||""} | ${proj.periodo||""}`:"Sin trámite";
      const persona=gU(proj.assignedTo);
      (proj.sesiones||[]).filter(s=>s.status==="cerrada").forEach(s=>{
        const fecha=new Date(s.fecha);if(d&&fecha<d)return;if(h&&fecha>h)return;
        filas.push({tramite,nombre:persona?.name||"—",horas:msToH(s.activeMs),hExt:0,actividad:`🗂 ${proj.nombre}`,tipo:"Proyecto",padre:"—",observacion:s.obs||"—",fecha:fmtDate(s.fecha),estado:proj.status==="completado"?"Completado":"Activo"});
      });
    });
    setRes(filas);
  };
  const descargar=()=>{
    if(!res?.length)return;
    const hdrs=["Trámite","Nombre","Tipo","Actividad","Tarea Padre","Horas Normales","Horas Extendidas","Observación","Fecha","Estado"];
    const rows=[hdrs,...res.map(r=>[r.tramite,r.nombre,r.tipo,r.actividad,r.padre,r.horas,r.hExt,r.observacion,r.fecha,r.estado])];
    const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=`reporte_census_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
  };
  const total=res?res.reduce((s,r)=>s+r.horas,0):0;
  const totalExt=res?res.reduce((s,r)=>s+(r.hExt||0),0):0;
  return <div>
    <h2 style={{margin:"0 0 20px",color:P.black,fontSize:19,fontWeight:800}}>📊 Reporte de Horas</h2>
    <div style={{background:P.white,borderRadius:12,border:`1px solid ${P.border}`,padding:20,marginBottom:16}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
        <div><label style={{fontSize:13,fontWeight:600,color:P.dark,display:"block",marginBottom:4}}>Desde</label><input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iSt,marginBottom:0}}/></div>
        <div><label style={{fontSize:13,fontWeight:600,color:P.dark,display:"block",marginBottom:4}}>Hasta</label><input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iSt,marginBottom:0}}/></div>
      </div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={consultar} style={{flex:1,padding:11,background:P.black,color:P.gold,border:"none",borderRadius:8,fontWeight:700,cursor:"pointer"}}>🔍 Consultar</button>
        {res?.length>0&&<button onClick={descargar} style={{flex:1,padding:11,background:P.gold,color:P.black,border:"none",borderRadius:8,fontWeight:700,cursor:"pointer"}}>⬇️ Descargar CSV</button>}
      </div>
    </div>
    {res&&<div style={{background:P.white,borderRadius:12,border:`1px solid ${P.border}`,padding:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <div><div style={{fontSize:16,fontWeight:800,color:P.black}}>Resultados</div><div style={{fontSize:13,color:P.gray}}>{res.length} registros</div></div>
        <div style={{display:"flex",gap:10}}>
          <div style={{background:P.lightG,border:`1px solid ${P.border}`,borderRadius:8,padding:"8px 16px",textAlign:"center"}}>
            <div style={{fontSize:11,fontWeight:700,color:P.goldD}}>HORAS NORMALES</div>
            <div style={{fontSize:20,fontWeight:800,color:P.black}}>{Math.round(total*100)/100}h</div>
          </div>
          <div style={{background:"#F5F3FF",border:`1px solid ${P.ext}`,borderRadius:8,padding:"8px 16px",textAlign:"center"}}>
            <div style={{fontSize:11,fontWeight:700,color:P.ext}}>🌙 HORAS EXT.</div>
            <div style={{fontSize:20,fontWeight:800,color:P.ext}}>{Math.round(totalExt*100)/100}h</div>
          </div>
        </div>
      </div>
      {res.length===0?<div style={{textAlign:"center",padding:40,color:P.gray}}>Sin registros.</div>
      :<div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{background:P.black}}>{["Trámite","Nombre","Tipo","Actividad","Horas","H.Ext","Observación","Fecha","Estado"].map(h=><th key={h} style={{padding:"10px",textAlign:"left",fontWeight:700,color:P.gold,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
          <tbody>{res.map((r,i)=><tr key={i} style={{borderBottom:`1px solid ${P.border}44`,background:i%2===0?P.white:P.lightG}}>
            <td style={{padding:"9px 10px",fontSize:11}}><div style={{fontWeight:600}}>{r.tramite.split(" | ")[0]}</div><div style={{color:P.goldD,fontSize:10}}>{r.tramite.split(" | ")[1]}</div></td>
            <td style={{padding:"9px 10px",fontWeight:600,whiteSpace:"nowrap"}}>{r.nombre}</td>
            <td style={{padding:"9px 10px"}}><span style={{fontSize:10,padding:"2px 7px",borderRadius:99,background:r.tipo==="Proyecto"?"#CCFBF1":r.tipo==="Sub-tarea"?"#E0F2FE":"#FDF6DC",color:r.tipo==="Proyecto"?P.proj:r.tipo==="Sub-tarea"?"#0369A1":P.goldD,fontWeight:700}}>{r.tipo}</span></td>
            <td style={{padding:"9px 10px",color:P.gray}}>{r.actividad}</td>
            <td style={{padding:"9px 10px",fontWeight:800,color:P.goldD,whiteSpace:"nowrap"}}>{r.horas>0?`${r.horas}h`:"—"}</td>
            <td style={{padding:"9px 10px",fontWeight:700,color:P.ext,whiteSpace:"nowrap"}}>{r.hExt>0?`🌙 ${r.hExt}h`:"—"}</td>
            <td style={{padding:"9px 10px",color:P.gray,fontSize:11,maxWidth:130}}>{r.observacion}</td>
            <td style={{padding:"9px 10px",color:P.gray,fontSize:11,whiteSpace:"nowrap"}}>{r.fecha}</td>
            <td style={{padding:"9px 10px"}}><span style={{fontSize:10,fontWeight:600,padding:"2px 7px",borderRadius:99,background:r.estado==="Completada"||r.estado==="Completado"?"#DCFCE7":"#FDF6DC",color:r.estado==="Completada"||r.estado==="Completado"?P.success:P.goldD}}>{r.estado}</span></td>
          </tr>)}</tbody>
        </table>
      </div>}
    </div>}
  </div>;
}

function App(){
  const[users,setUsers]=useState(INIT_USERS);
  const[cur,setCur]=useState(null);
  const[lEmail,setLEmail]=useState("");const[lPass,setLPass]=useState("");const[showPass,setShowPass]=useState(false);const[lErr,setLErr]=useState("");
  const[tasks,setTasks]=useState([]);
  const[projects,setProjects]=useState([]);
  const[clients,setClients]=useState([]);
  const[notifs,setNotifs]=useState([]);
  const[view,setView]=useState("board");
  const[,setTick]=useState(0);
  const[fbReady,setFbReady]=useState(false);
  const[loading,setLoading]=useState(true);
  const[customActivities,setCustomActivities]=useState([]);
  const[extendedTasks,setExtendedTasks]=useState({});

  const[showNT,setShowNT]=useState(false);
  const[showNotifP,setShowNotifP]=useState(false);
  const[showST,setShowST]=useState(null);
  const[showAv,setShowAv]=useState(false);
  const[showCF,setShowCF]=useState(false);const[editCl,setEditCl]=useState(null);
  const[showCP,setShowCP]=useState(false);
  const[pf,setPf]=useState({current:"",nuevo:"",confirm:""});const[pErr,setPErr]=useState("");const[pOk,setPOk]=useState(false);
  const[showEv,setShowEv]=useState(null);const[evNombre,setEvNombre]=useState("");
  const[showObs,setShowObs]=useState(null);const[obsT,setObsT]=useState("");
  const[showDel,setShowDel]=useState(null);
  const[editColab,setEditColab]=useState(null);
  const[showNoUrgente,setShowNoUrgente]=useState(false);
  const[showActMgr,setShowActMgr]=useState(false);const[newAct,setNewAct]=useState("");
  const[showNProy,setShowNProy]=useState(false);
  const[nproy,setNproy]=useState({nombre:"",assignedTo:"",clientId:"",tipoDevolucion:"",periodos:[]});
  const[editProy,setEditProy]=useState(null); // proyecto a editar
  const[nt,setNt]=useState({title:"",assignedTo:"",clientId:"",tipoDevolucion:"",periodos:[],urgente:false});
  const[nst,setNst]=useState({title:"",assignedTo:""});
  const[clf,setClf]=useState({compania:"",tiposDevolucion:[],periodos:[""]});

  useEffect(()=>{const t=setInterval(()=>setTick(x=>x+1),1000);return()=>clearInterval(t);},[]);
  useEffect(()=>{if(window._fbReady){setFbReady(true);return;}window.addEventListener("fb-ready",()=>setFbReady(true),{once:true});},[]);

  useEffect(()=>{
    if(!fbReady)return;
    const db=window._db;
    const unsubT=window._snap(window._col(db,"tasks"),snap=>{setTasks(snap.docs.map(d=>d.data()));setLoading(false);});
    const unsubP=window._snap(window._col(db,"projects"),snap=>{setProjects(snap.docs.map(d=>d.data()));});
    const unsubC=window._snap(window._col(db,"clients"),snap=>{setClients(snap.docs.map(d=>d.data()));});
    const unsubU=window._snap(window._col(db,"users"),snap=>{
      if(snap.docs.length===0){INIT_USERS.forEach(u=>fbSet("users",u.id,u));}
      else{const data=snap.docs.map(d=>d.data());const ids=data.map(u=>String(u.id));INIT_USERS.filter(u=>!ids.includes(String(u.id))).forEach(u=>fbSet("users",u.id,u));setUsers(data);}
    });
    const unsubCfg=window._snap(window._col(db,"config"),snap=>{snap.docs.forEach(d=>{if(d.id==="activities")setCustomActivities(d.data().list||[]);});});
    return()=>{unsubT();unsubP();unsubC();unsubU();unsubCfg();};
  },[fbReady]);

  useEffect(()=>{
    const chk=()=>{const w=isWorkHour();tasks.forEach(t=>{
      if(!w&&t.status==="inprogress"&&!extendedTasks[t.id]?.active)fbSet("tasks",t.id,{...t,status:"paused",activeMs:t.activeMs+(ts()-t.startedAt),pausedAt:ts(),autopaused:true});
      if(w&&t.status==="paused"&&t.autopaused)fbSet("tasks",t.id,{...t,status:"inprogress",startedAt:ts(),pausedAt:null,autopaused:false});
    });};
    const iv=setInterval(chk,60000);return()=>clearInterval(iv);
  },[tasks,extendedTasks]);

  const gU=id=>users.find(u=>String(u.id)===String(id));
  const gC=id=>clients.find(c=>String(c.id)===String(id));
  const allActivities=[...TASKS_LIST,...customActivities];
  const role=cur?.role,isJ=role==="jefe",isC=role==="coordinadora",isSr=role==="senior",isSs=role==="semsenior";
  const canAssign=isJ||isC||isSr||isSs;
  const canClients=isJ||isC||isSr;
  const canAddPeriodos=isSs;
  const canAssignProjects=isJ||isC||isSr||isSs;
  const isSplitView=isC||isSr||isSs;
  const assignTo=!cur?[]:isJ?users.filter(u=>u.id!==cur.id):users.filter(u=>CAN_ASSIGN_TO[role]?.includes(u.role));
  const subTo=!cur?[]:users.filter(u=>CAN_ASSIGN_TO[role]?.includes(u.role));
  const projAssignTo=users.filter(u=>u.id!==cur?.id);
  const myN=cur?notifs.filter(n=>n.userId===cur.id):[];
  const unread=myN.filter(n=>!n.read).length;
  const pushN=(uid,msg,tipo,tt)=>setNotifs(p=>[{id:ts(),userId:uid,msg,tipo,taskTitle:tt,read:false},...p]);

  const myTasks=()=>{
    if(!cur)return[];
    if(isJ||isC)return tasks;
    if(isSr||isSs)return tasks.filter(t=>String(t.assignedTo)===String(cur.id)||String(t.assignedBy)===String(cur.id));
    return tasks.filter(t=>String(t.assignedTo)===String(cur.id));
  };

  const myProjects=()=>{
    if(!cur)return[];
    if(isJ||isC)return projects;
    return projects.filter(p=>String(p.assignedTo)===String(cur.id));
  };

  const hasActiveTask=uid=>tasks.some(t=>String(t.assignedTo)===String(uid)&&t.status==="inprogress");

  const startNextQueued=async uid=>{
    const q=tasks.filter(t=>String(t.assignedTo)===String(uid)&&t.status==="queued").sort((a,b)=>(b.urgente?1:0)-(a.urgente?1:0));
    if(q.length>0){const next={...q[0],status:"inprogress",startedAt:ts()};await fbSet("tasks",next.id,next);pushN(uid,"Tu siguiente tarea inició automáticamente","nueva",next.title);}
  };

  const updTask=async(tid,fn)=>{const t=tasks.find(t=>String(t.id)===String(tid));if(!t)return;await fbSet("tasks",tid,fn(t));};

  const toggleUrgente=async tid=>{const t=tasks.find(t=>String(t.id)===String(tid));if(!t)return;await fbSet("tasks",tid,{...t,urgente:!t.urgente});};

  const activarUrgente=async currentId=>{
    const curr=tasks.find(t=>String(t.id)===String(currentId));if(!curr)return;
    const uid=curr.assignedTo;
    const uq=tasks.filter(t=>String(t.assignedTo)===String(uid)&&t.status==="queued"&&t.urgente).sort((a,b)=>a.id>b.id?1:-1);
    if(uq.length===0){setShowNoUrgente(true);return;}
    await fbSet("tasks",currentId,{...curr,status:"paused",activeMs:curr.activeMs+(ts()-curr.startedAt),pausedAt:ts(),autopaused:false});
    await fbSet("tasks",uq[0].id,{...uq[0],status:"inprogress",startedAt:ts()});
    pushN(uid,`⚡ Tarea urgente iniciada: ${uq[0].title}`,"nueva",uq[0].title);
  };

  const reanudar=async tid=>updTask(tid,t=>({...t,status:"inprogress",startedAt:ts(),pausedAt:null,autopaused:false}));

  const confirmarEv=async()=>{
    if(!evNombre.trim()||!showEv)return;
    await updTask(showEv.tid,t=>({...t,status:"paused",activeMs:t.activeMs+(ts()-t.startedAt),pausedAt:ts(),autopaused:false,eventoNombre:evNombre.trim()}));
    setShowEv(null);setEvNombre("");
  };

  const iniciarComplete=tid=>{setObsT("");setShowObs(tid);};
  const doComplete=async()=>{
    if(!showObs)return;
    const task=tasks.find(t=>String(t.id)===String(showObs));
    // guardar extendedMs acumulado
    const ext=extendedTasks[showObs];
    const extraMs=ext?.active?(ext.activeMs+(ts()-ext.startedAt)):ext?.activeMs||0;
    await updTask(showObs,item=>{
      const total=item.status==="paused"?item.activeMs:item.activeMs+(ts()-item.startedAt);
      return{...item,status:"done",completedAt:ts(),activeMs:total,hours:msToH(total),observacion:obsT.trim()||null,extendedMs:(item.extendedMs||0)+extraMs};
    });
    if(ext)setExtendedTasks(p=>{const n={...p};delete n[showObs];return n;});
    await startNextQueued(task.assignedTo);
    setShowObs(null);setObsT("");
  };

  const toggleExtended=async(tid)=>{
    const task=tasks.find(t=>String(t.id)===String(tid));if(!task)return;
    const ext=extendedTasks[tid]||{active:false,startedAt:null,activeMs:0};
    if(ext.active){
      const ms=ext.activeMs+(ts()-ext.startedAt);
      setExtendedTasks(p=>({...p,[tid]:{active:false,startedAt:null,activeMs:ms}}));
      await fbSet("tasks",tid,{...task,extendedMs:(task.extendedMs||0)+(ms-ext.activeMs)});
    }else{
      setExtendedTasks(p=>({...p,[tid]:{active:true,startedAt:ts(),activeMs:ext.activeMs}}));
      if(task.status==="paused")await fbSet("tasks",tid,{...task,status:"inprogress",startedAt:ts(),pausedAt:null,autopaused:false});
    }
  };

  const liveExtMs=tid=>{const ext=extendedTasks[tid];if(!ext)return 0;return ext.active?ext.activeMs+(ts()-ext.startedAt):ext.activeMs;};

  const addTaskMasiva=async()=>{
    if(!nt.title||!nt.assignedTo||!nt.clientId||!nt.tipoDevolucion||!nt.periodos?.length)return;
    for(const periodo of nt.periodos){
      await new Promise(r=>setTimeout(r,60));
      const activo=hasActiveTask(nt.assignedTo);
      const status=(!activo||nt.urgente)?"inprogress":"queued";
      if(nt.urgente&&activo){const curr=tasks.find(t=>String(t.assignedTo)===String(nt.assignedTo)&&t.status==="inprogress");if(curr)await fbSet("tasks",curr.id,{...curr,status:"paused",activeMs:curr.activeMs+(ts()-curr.startedAt),pausedAt:ts(),autopaused:false});}
      const task=mkTask({title:nt.title,assignedTo:nt.assignedTo,assignedBy:cur.id,clientId:nt.clientId,tipoDevolucion:nt.tipoDevolucion,periodo,urgente:!!nt.urgente,status,startedAt:status==="inprogress"?ts():null,activeMs:0});
      await fbSet("tasks",task.id,task);
    }
    pushN(nt.assignedTo,`${cur.firstName} te asignó ${nt.periodos.length} tarea${nt.periodos.length>1?"s":""}`,"nueva",nt.title);
    setNt({title:"",assignedTo:"",clientId:"",tipoDevolucion:"",periodos:[],urgente:false});setShowNT(false);
  };

  const addSub=async pid=>{
    if(!nst.title||!nst.assignedTo)return;
    const parent=tasks.find(t=>String(t.id)===String(pid));if(!parent)return;
    const st=mkTask({title:nst.title,assignedTo:nst.assignedTo,assignedBy:cur.id,parentId:pid,parentTitle:parent.title,clientId:parent.clientId,tipoDevolucion:parent.tipoDevolucion,periodo:parent.periodo});
    await fbSet("tasks",st.id,st);
    pushN(nst.assignedTo,`${cur.firstName} te asignó una sub-tarea`,"nueva",nst.title);
    setNst({title:"",assignedTo:""});setShowST(null);
  };

  const addProyecto=async()=>{
    if(!nproy.nombre.trim()||!nproy.assignedTo||!nproy.clientId||!nproy.periodos?.length)return;
    const proj={id:"p"+ts(),nombre:nproy.nombre.trim(),assignedTo:nproy.assignedTo,assignedBy:cur.id,clientId:nproy.clientId,tipoDevolucion:nproy.tipoDevolucion||"",periodos:nproy.periodos,sesiones:[],status:"pendiente",creadoAt:ts()};
    await fbSet("projects",proj.id,proj);
    pushN(nproy.assignedTo,`${cur.firstName} te asignó el proyecto: ${proj.nombre}`,"nueva",proj.nombre);
    setNproy({nombre:"",assignedTo:"",clientId:"",tipoDevolucion:"",periodos:[]});setShowNProy(false);
  };

  const saveEditProy=async()=>{
    if(!editProy)return;
    await fbSet("projects",editProy.id,editProy);
    setEditProy(null);
  };

  const sendRem=task=>{const a=gU(task.assignedTo);if(!a)return;pushN(task.assignedTo,"Recordatorio de tarea pendiente","pendiente",task.title);alert(`✅ Recordatorio enviado a ${a.firstName}`);};

  const openNC=()=>{setClf({compania:"",tiposDevolucion:[],periodos:[""]});setEditCl(null);setShowCF(true);};
  const openEC=cl=>{setClf({compania:cl.compania,tiposDevolucion:cl.tiposDevolucion||[],periodos:[...(cl.periodos||[])]});setEditCl(cl);setShowCF(true);};
  const saveCl=async()=>{
    if(!clf.compania.trim()||clf.tiposDevolucion.length===0)return;
    const p=clf.periodos.filter(x=>x.trim());
    const cl=editCl?{...editCl,compania:clf.compania,tiposDevolucion:clf.tiposDevolucion,periodos:p}:{id:"c"+ts(),compania:clf.compania,tiposDevolucion:clf.tiposDevolucion,periodos:p};
    await fbSet("clients",cl.id,cl);setShowCF(false);
  };
  const toggleTipoDevolucion=td=>setClf(f=>({...f,tiposDevolucion:f.tiposDevolucion.includes(td)?f.tiposDevolucion.filter(x=>x!==td):[...f.tiposDevolucion,td]}));
  const selAv=async a=>{const u={...cur,avatar:a};setUsers(users.map(x=>x.id===cur.id?u:x));setCur(u);await fbSet("users",cur.id,u);setShowAv(false);};
  const savePass=async()=>{
    if(pf.current!==cur.password){setPErr("Contraseña actual incorrecta.");return;}
    if(pf.nuevo.length<4){setPErr("Mínimo 4 caracteres.");return;}
    if(pf.nuevo!==pf.confirm){setPErr("No coinciden.");return;}
    const u={...cur,password:pf.nuevo};setUsers(users.map(x=>x.id===cur.id?u:x));setCur(u);await fbSet("users",cur.id,u);
    setPErr("");setPOk(true);setTimeout(()=>{setShowCP(false);setPOk(false);setPf({current:"",nuevo:"",confirm:""});},1500);
  };
  const saveColab=async updated=>{await fbSet("users",updated.id,updated);setUsers(users.map(u=>u.id===updated.id?updated:u));if(cur.id===updated.id)setCur(updated);setEditColab(null);};
  const saveActivity=async()=>{const t=newAct.trim();if(!t||allActivities.includes(t))return;const updated=[...customActivities,t];setCustomActivities(updated);await fbSet("config","activities",{list:updated});setNewAct("");};
  const deleteActivity=async act=>{const updated=customActivities.filter(a=>a!==act);setCustomActivities(updated);await fbSet("config","activities",{list:updated});};
  const doLogin=()=>{const u=users.find(u=>u.email.toLowerCase()===lEmail.toLowerCase());if(u&&u.password===lPass){setCur(u);setLErr("");}else setLErr("Correo o contraseña incorrectos.");};

  if(!fbReady||loading)return(
    <div style={{minHeight:"100vh",background:`linear-gradient(135deg,${P.black},${P.dark})`,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center",color:P.gold}}>
        <div style={{fontSize:50,marginBottom:16}}>⏱️</div>
        <div style={{fontSize:18,fontWeight:700,letterSpacing:2}}>TIMETRACK PRO</div>
        <div style={{marginTop:20,width:40,height:40,border:`3px solid ${P.gold}`,borderTop:"3px solid transparent",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"20px auto"}}></div>
      </div>
    </div>
  );

  if(!cur)return(
    <div style={{minHeight:"100vh",background:`linear-gradient(135deg,${P.black},${P.dark})`,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:P.white,borderRadius:16,padding:36,width:380,boxShadow:"0 20px 60px #00000066",border:`1px solid ${P.border}`}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{width:70,height:70,background:`linear-gradient(135deg,${P.black},${P.goldD})`,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",fontSize:34,margin:"0 auto 12px",border:`2px solid ${P.gold}`}}>⏱️</div>
          <h2 style={{margin:"0 0 2px",color:P.black,fontSize:22,fontWeight:800}}>TimeTrack Pro</h2>
          <p style={{color:P.goldD,fontSize:13,margin:0,fontWeight:600}}>Census Consultores</p>
        </div>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Correo institucional</label>
        <input value={lEmail} onChange={e=>setLEmail(e.target.value)} placeholder="nombre@censusconsultores.com.ec" style={{...iSt,marginTop:4,marginBottom:8}} type="email"/>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Contraseña</label>
        <div style={{position:"relative",marginTop:4,marginBottom:12}}>
          <input value={lPass} onChange={e=>setLPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doLogin()} placeholder="Contraseña" type={showPass?"text":"password"} style={{...iSt,marginTop:0,marginBottom:0,paddingRight:40}}/>
          <button onClick={()=>setShowPass(s=>!s)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:P.gray}}>{showPass?"🙈":"👁️"}</button>
        </div>
        {lErr&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"8px 12px",color:P.danger,fontSize:13,marginBottom:10}}>⚠️ {lErr}</div>}
        <button onClick={doLogin} style={{width:"100%",marginTop:4,padding:12,background:P.black,color:P.gold,border:`1px solid ${P.gold}`,borderRadius:8,fontWeight:700,fontSize:15,cursor:"pointer"}}>INGRESAR</button>
      </div>
    </div>
  );

  const nav=[{id:"board",icon:"📋",label:"Tablero"},{id:"clients",icon:"🏢",label:"Clientes"},{id:"colabs",icon:"👥",label:"Colaboradores"},{id:"report",icon:"📊",label:"Reportes"},...(isJ?[{id:"team",icon:"🏠",label:"Equipo"}]:[])];
  const sortedTasks=()=>[...myTasks()].filter(t=>t.status!=="done").sort((a,b)=>(b.urgente?1:0)-(a.urgente?1:0));

  const renderTask=task=>{
    const isSub=!!task.parentId;
    const asg=gU(task.assignedTo),asr=gU(task.assignedBy),cl=gC(task.clientId);
    const act=liveMs(task),isR=task.status==="inprogress",isP=task.status==="paused",isD=task.status==="done",isQ=task.status==="queued";
    const isAssignee=String(task.assignedTo)===String(cur.id);
    const canSub=!isSub&&isAssignee&&CAN_ASSIGN_TO[role]?.length>0;
    const borderCol=task.urgente?P.urgent:isSub?"#0369A1":isP?P.goldD:isR?P.gold:isQ?"#7C3AED33":P.border;
    const extActive=extendedTasks[task.id]?.active;

    return <div key={task.id} style={{background:P.white,borderRadius:12,border:`1.5px solid ${borderCol}`,padding:16,marginBottom:12,boxShadow:extActive?`0 2px 16px ${P.ext}44`:isR?`0 2px 12px ${P.gold}33`:"0 1px 4px #00000011",opacity:isQ?0.85:1}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
        <div style={{flex:1,minWidth:180}}>
          <div style={{display:"flex",alignItems:"center",marginBottom:6,gap:6,flexWrap:"wrap"}}>
            {isSub&&<span style={{background:"#E0F2FE",color:"#0369A1",fontSize:10,padding:"2px 7px",borderRadius:99,fontWeight:800}}>↳ SUB-TAREA</span>}
            {task.urgente&&<span style={{background:P.urgent,color:P.white,fontSize:10,padding:"1px 6px",borderRadius:99,fontWeight:800}}>⚡ URGENTE</span>}
            {isQ&&<span style={{background:"#EDE9FE",color:P.urgent,fontSize:10,padding:"1px 6px",borderRadius:99,fontWeight:800}}>⏳ EN COLA</span>}
            {extActive&&<span style={{background:"#F5F3FF",color:P.ext,fontSize:10,padding:"1px 6px",borderRadius:99,fontWeight:800}}>🌙 MODO EXTENDIDO</span>}
            <span style={{fontWeight:700,color:P.black,fontSize:14}}>{task.title}</span>
            {!isSub&&<button onClick={()=>setShowDel(task.id)} style={{marginLeft:"auto",padding:"3px 10px",background:"#FEF2F2",color:P.danger,border:"1px solid #FECACA",borderRadius:7,fontWeight:700,cursor:"pointer",fontSize:12}}>🗑️</button>}
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
            <span style={{background:isD?"#DCFCE7":isQ?"#EDE9FE":isP?"#FFF7ED":"#FDF6DC",color:isD?P.success:isQ?P.urgent:P.goldD,padding:"2px 8px",borderRadius:99,fontSize:11,fontWeight:600}}>
              {isD?"✅ Completada":isQ?"⏳ En cola":isP?"⏸ Pausada":"▶ En progreso"}
            </span>
            {isSub&&task.parentTitle&&<span style={{fontSize:11,color:"#0369A1",background:"#E0F2FE",padding:"2px 8px",borderRadius:99}}>📋 {task.parentTitle}</span>}
            {cl&&<span style={{fontSize:11,color:P.goldD,background:P.lightG,padding:"2px 8px",borderRadius:99,border:`1px solid ${P.border}`}}>🏢 {cl.compania}</span>}
            {task.tipoDevolucion&&<span style={{fontSize:11,color:"#1A4A7A",background:"#D6E8F7",padding:"2px 8px",borderRadius:99}}>📋 {task.tipoDevolucion}</span>}
            {task.periodo&&<span style={{fontSize:11,color:P.gray,background:P.lightG,padding:"2px 8px",borderRadius:99}}>📅 {task.periodo}</span>}
            {asg&&<span style={rBadge(asg.role)}>{asg.avatar} {asg.firstName}</span>}
            {asr&&<span style={{fontSize:11,color:P.gray}}>por {asr.firstName}</span>}
            {task.eventoNombre&&isP&&<span style={{fontSize:11,background:"#FFF0CC",color:P.goldD,padding:"2px 8px",borderRadius:99}}>📌 {task.eventoNombre}</span>}
          </div>
          {task.observacion&&isD&&<div style={{marginTop:6,fontSize:12,color:P.gray,background:P.lightG,borderRadius:6,padding:"5px 8px",border:`1px solid ${P.border}`}}>💬 {task.observacion}</div>}
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
          {!isQ&&<div style={{background:extActive?"#F5F3FF":isD?"#F9F5E7":isP?"#FFF7ED":P.lightG,border:`1.5px solid ${extActive?P.ext:isD?P.gold:isP?P.goldD:P.gold}`,borderRadius:8,padding:"6px 12px",textAlign:"center",minWidth:116}}>
            <div style={{fontSize:10,fontWeight:700,color:extActive?P.ext:P.goldD}}>{extActive?"🌙 EXTENDIDO":isD?"✅ TOTAL":isP?"⏸ PAUSADO":"🔴 ACTIVO"}</div>
            <div style={{fontSize:14,fontWeight:800,color:P.black,fontVariantNumeric:"tabular-nums"}}>{fmtT(act)}</div>
            {extActive&&<div style={{fontSize:10,color:P.ext}}>+{fmtT(liveExtMs(task.id))} ext.</div>}
            {isD&&task.hours&&<div style={{fontSize:10,color:P.gray}}>{task.hours}h</div>}
          </div>}
          {isQ&&<div style={{background:"#EDE9FE",border:`1.5px solid ${P.urgent}`,borderRadius:8,padding:"8px 12px",textAlign:"center",minWidth:116}}>
            <div style={{fontSize:10,fontWeight:700,color:P.urgent}}>⏳ EN ESPERA</div>
            <div style={{fontSize:11,color:P.gray,marginTop:2}}>Iniciará al completar<br/>la tarea actual</div>
          </div>}
          <div style={{display:"flex",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>
            {!isSub&&!isD&&!isR&&<button onClick={()=>toggleUrgente(task.id)} style={{padding:"5px 9px",background:task.urgente?P.urgent:"transparent",color:task.urgente?P.white:P.urgent,border:`1px solid ${P.urgent}`,borderRadius:7,cursor:"pointer",fontSize:12,fontWeight:700}}>⚡</button>}
            {!isSub&&!isD&&isR&&<button onClick={()=>activarUrgente(task.id)} style={{padding:"5px 9px",background:P.gold,color:P.black,border:`1px solid ${P.goldD}`,borderRadius:7,cursor:"pointer",fontSize:12,fontWeight:800}}>⚡</button>}
            {!isSub&&!isD&&!isQ&&<button onClick={()=>sendRem(task)} style={{padding:"5px 9px",background:P.black,color:P.gold,border:`1px solid ${P.gold}`,borderRadius:7,cursor:"pointer",fontSize:12}}>🔔</button>}
            {/* Modo extendido */}
            {!isD&&!isQ&&isAssignee&&<button onClick={()=>toggleExtended(task.id)} style={{padding:"5px 9px",background:extActive?P.ext:"transparent",color:extActive?P.white:P.ext,border:`1.5px solid ${P.ext}`,borderRadius:7,cursor:"pointer",fontSize:12,fontWeight:800}}>🌙</button>}
            {!isD&&!isQ&&isR&&isAssignee&&<button onClick={()=>{setEvNombre("");setShowEv({tid:task.id});}} style={{padding:"6px 10px",background:P.danger,color:P.white,border:"none",borderRadius:7,fontWeight:700,cursor:"pointer",fontSize:11}}>📌 Evento</button>}
            {!isD&&!isQ&&isP&&isAssignee&&<button onClick={()=>reanudar(task.id)} style={{padding:"6px 10px",background:P.success,color:P.white,border:"none",borderRadius:7,fontWeight:700,cursor:"pointer",fontSize:11}}>▶ Reanudar</button>}
            {!isD&&!isQ&&isAssignee&&<button onClick={()=>iniciarComplete(task.id)} style={{padding:"6px 12px",background:P.gold,color:P.black,border:"none",borderRadius:7,fontWeight:700,cursor:"pointer",fontSize:12}}>✅ Completar</button>}
            {!isSub&&!isD&&!isQ&&canSub&&<button onClick={()=>setShowST(task.id)} style={{padding:"6px 12px",background:P.black,color:P.gold,border:`1px solid ${P.gold}`,borderRadius:7,fontWeight:600,cursor:"pointer",fontSize:12}}>+ Sub</button>}
            {isSub&&canAssign&&<button onClick={()=>setShowDel(task.id)} style={{padding:"5px 9px",background:"#FEF2F2",color:P.danger,border:"1px solid #FECACA",borderRadius:7,fontWeight:700,cursor:"pointer",fontSize:12}}>🗑️</button>}
          </div>
        </div>
      </div>
    </div>;
  };

  return(
    <div style={{minHeight:"100vh",background:P.lightG}}>
      <div style={{background:P.black,borderBottom:`2px solid ${P.gold}`,padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,background:`linear-gradient(135deg,${P.goldD},${P.gold})`,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>⏱️</div>
          <div><div style={{fontWeight:800,fontSize:16,color:P.gold,letterSpacing:1}}>TimeTrack Pro</div><div style={{fontSize:10,color:P.goldL,letterSpacing:2}}>CENSUS CONSULTORES</div></div>
        </div>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
          {nav.map(v=><button key={v.id} onClick={()=>setView(v.id)} style={{padding:"6px 13px",borderRadius:7,border:`1px solid ${view===v.id?P.gold:"transparent"}`,background:view===v.id?P.gold:"transparent",color:view===v.id?P.black:P.goldL,fontWeight:600,cursor:"pointer",fontSize:12}}>{v.icon} {v.label}</button>)}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{position:"relative"}}>
            <button onClick={()=>setShowNotifP(!showNotifP)} style={{width:34,height:34,borderRadius:"50%",background:"transparent",border:`1px solid ${P.gold}`,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:P.gold}}>🔔</button>
            {unread>0&&<div style={{position:"absolute",top:-3,right:-3,background:P.danger,color:P.white,borderRadius:"50%",width:17,height:17,fontSize:9,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}}>{unread}</div>}
          </div>
          <div onClick={()=>setShowAv(true)} style={{width:36,height:36,borderRadius:"50%",background:rbg(role),border:`2px solid ${P.gold}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,cursor:"pointer"}}>{cur.avatar}</div>
          <div><div style={{fontSize:13,fontWeight:700,color:P.gold}}>{cur.firstName}</div><span style={{...rBadge(role),fontSize:10}}>{rl(role)}</span></div>
          <button onClick={()=>setShowCP(true)} style={{padding:"5px 10px",borderRadius:6,border:`1px solid ${P.gold}`,background:"transparent",color:P.gold,cursor:"pointer",fontSize:12}}>🔑</button>
          <button onClick={()=>setCur(null)} style={{padding:"5px 10px",borderRadius:6,border:`1px solid ${P.goldD}`,background:"transparent",color:P.goldL,cursor:"pointer",fontSize:12}}>Salir</button>
        </div>
      </div>

      {showNotifP&&<div style={{position:"fixed",top:62,right:14,width:320,background:P.white,borderRadius:14,boxShadow:"0 8px 32px #00000033",border:`1px solid ${P.border}`,zIndex:200,maxHeight:440,display:"flex",flexDirection:"column"}}>
        <div style={{padding:"12px 14px",borderBottom:`1px solid ${P.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:P.black,borderRadius:"14px 14px 0 0"}}>
          <span style={{fontWeight:800,color:P.gold,fontSize:14}}>🔔 Notificaciones</span>
          <div style={{display:"flex",gap:8}}>
            {unread>0&&<button onClick={()=>setNotifs(notifs.map(n=>n.userId===cur.id?{...n,read:true}:n))} style={{fontSize:11,color:P.goldL,background:"transparent",border:"none",cursor:"pointer"}}>Marcar leídas</button>}

      <div style={{padding:20,maxWidth:1200,margin:"0 auto"}}>
        {view==="board"&&(()=>{
          const allT=sortedTasks();
          const myProjs=myProjects();
          const misTareas=isSplitView?allT.filter(t=>String(t.assignedTo)===String(cur.id)):allT;
          const tareasAsignadas=isSplitView?allT.filter(t=>String(t.assignedBy)===String(cur.id)&&String(t.assignedTo)!==String(cur.id)):[];
          const misProyectos=(isSr||isSs)?myProjs.filter(p=>String(p.assignedTo)===String(cur.id)):[];
          const proyAsignados=canAssignProjects?myProjs.filter(p=>String(p.assignedBy)===String(cur.id)&&String(p.assignedTo)!==String(cur.id)):[];

          return <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,flexWrap:"wrap",gap:8}}>

              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {(isC||isSr||isJ)&&<button onClick={()=>setShowActMgr(true)} style={{padding:"9px 14px",background:"#F0F9FF",color:"#0369A1",border:`1px solid ${P.ai}`,borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>⚙️ Actividades</button>}
                {canAssignProjects&&<button onClick={()=>setShowNProy(true)} style={{padding:"9px 16px",background:P.proj,color:P.white,border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>🗂 Nuevo Proyecto</button>}
                {canAssign&&<button onClick={()=>setShowNT(true)} style={{padding:"9px 20px",background:P.black,color:P.gold,border:`1px solid ${P.gold}`,borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>+ Nueva Tarea</button>}
              </div>
            </div>

            {isSplitView?(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,alignItems:"start"}}>
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:8,borderBottom:`2px solid ${P.gold}`}}>
                    <span style={{fontSize:16}}>📥</span>
                    <span style={{fontWeight:800,color:P.black,fontSize:15}}>Mis tareas</span>
                    <span style={{background:P.gold,color:P.black,borderRadius:99,fontWeight:800,fontSize:11,padding:"1px 8px",marginLeft:"auto"}}>{misTareas.length+misProyectos.length}</span>
                  </div>
                  {misProyectos.map(p=><ProyectoCard key={p.id} proj={p} cur={cur} users={users} clients={clients} tasks={tasks} onDelete={id=>fbDel("projects",id)} onEdit={p=>setEditProy(p)}/>)}
                  {misTareas.length===0&&misProyectos.length===0&&<div style={{textAlign:"center",padding:40,color:P.gray,fontSize:13,background:P.white,borderRadius:10,border:`1px dashed ${P.border}`}}>Sin asignaciones pendientes</div>}
                  {misTareas.map(renderTask)}
                </div>
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:8,borderBottom:`2px solid ${P.proj}`}}>
                    <span style={{fontSize:16}}>📤</span>
                    <span style={{fontWeight:800,color:P.black,fontSize:15}}>Tareas asignadas</span>
                    <span style={{background:P.proj,color:P.white,borderRadius:99,fontWeight:800,fontSize:11,padding:"1px 8px",marginLeft:"auto"}}>{tareasAsignadas.length+proyAsignados.length}</span>
                  </div>
                  {proyAsignados.map(p=><ProyectoCard key={p.id} proj={p} cur={cur} users={users} clients={clients} tasks={tasks} onDelete={id=>fbDel("projects",id)} onEdit={p=>setEditProy(p)}/>)}
                  {tareasAsignadas.length===0&&proyAsignados.length===0&&<div style={{textAlign:"center",padding:40,color:P.gray,fontSize:13,background:P.white,borderRadius:10,border:`1px dashed ${P.border}`}}>No has asignado tareas aún</div>}
                  {tareasAsignadas.map(renderTask)}
                </div>
              </div>
            ):(
              <>
                {(isJ||isC)&&myProjs.length>0&&<>
                  <div style={{fontSize:13,fontWeight:700,color:P.proj,marginBottom:10,display:"flex",alignItems:"center",gap:6}}>🗂 Proyectos <span style={{background:"#CCFBF1",color:P.proj,borderRadius:99,fontSize:11,padding:"1px 8px",fontWeight:800}}>{myProjs.length}</span></div>
                  {myProjs.map(p=><ProyectoCard key={p.id} proj={p} cur={cur} users={users} clients={clients} tasks={tasks} onDelete={id=>fbDel("projects",id)} onEdit={p=>setEditProy(p)}/>)}
                  {allT.length>0&&<div style={{fontSize:13,fontWeight:700,color:P.goldD,margin:"16px 0 10px"}}>📋 Tareas</div>}
                </>}
                {allT.length===0&&myProjs.length===0&&<div style={{textAlign:"center",padding:60,color:P.gray}}>No hay tareas ni proyectos aún.</div>}
                {allT.map(renderTask)}
              </>
            )}
          </>;
        })()}

        {view==="clients"&&<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:8}}>
            <h2 style={{margin:0,color:P.black,fontSize:19,fontWeight:800}}>🏢 Clientes</h2>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{
                const hdrs=["Compañía","Tipos de Devolución","Periodos"];
                const rows=[hdrs,...clients.map(c=>[c.compania,(c.tiposDevolucion||[]).join(" | "),(c.periodos||[]).join(" | ")])];
                const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
                const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
                const url=URL.createObjectURL(blob),a=document.createElement("a");
                a.href=url;a.download=`clientes_census_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
              }} style={{padding:"8px 16px",background:P.gold,color:P.black,border:"none",borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>⬇️ Exportar</button>
              {canClients&&<button onClick={openNC} style={{padding:"8px 18px",background:P.black,color:P.gold,border:`1px solid ${P.gold}`,borderRadius:8,fontWeight:700,cursor:"pointer",fontSize:13}}>+ Nuevo Cliente</button>}
            </div>
          </div>
          {!canClients&&!canAddPeriodos&&<div style={{background:"#FFF8E7",border:`1px solid ${P.border}`,borderRadius:10,padding:12,color:P.goldD,fontSize:13,marginBottom:14}}>Solo Jefe, Coordinador y Senior pueden gestionar clientes.</div>}
          {canAddPeriodos&&<div style={{background:"#F0F9FF",border:`1px solid ${P.ai}`,borderRadius:10,padding:12,color:"#0369A1",fontSize:13,marginBottom:14}}>📅 Puedes agregar periodos a los clientes existentes.</div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:14}}>
            {clients.map(cl=><div key={cl.id} style={{background:P.white,borderRadius:12,border:`1.5px solid ${P.border}`,padding:18}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                <div style={{display:"flex",gap:10,alignItems:"center"}}>
                  <div style={{width:42,height:42,borderRadius:10,background:P.lightG,border:`1px solid ${P.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>🏢</div>
                  <div style={{fontWeight:800,color:P.black,fontSize:14}}>{cl.compania}</div>
                </div>
                <div style={{display:"flex",gap:4}}>
                  {canClients&&<><button onClick={()=>openEC(cl)} style={{padding:"4px 8px",background:P.lightG,border:`1px solid ${P.border}`,borderRadius:6,cursor:"pointer"}}>✏️</button>
                  <button onClick={()=>fbDel("clients",cl.id)} style={{padding:"4px 8px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:6,cursor:"pointer"}}>🗑️</button></>}
                  {canAddPeriodos&&<button onClick={()=>openEC(cl)} style={{padding:"4px 10px",background:"#F0F9FF",border:`1px solid ${P.ai}`,borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:700,color:"#0369A1"}}>📅 +Periodo</button>}
                </div>
              </div>
              <div style={{fontSize:11,fontWeight:700,color:P.goldD,marginBottom:6}}>TIPOS DE DEVOLUCIÓN</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>{(cl.tiposDevolucion||[]).map((td,i)=><span key={i} style={{fontSize:10,background:"#D6E8F7",color:"#1A4A7A",padding:"2px 8px",borderRadius:99,fontWeight:600}}>{td}</span>)}</div>
              <div style={{fontSize:11,fontWeight:700,color:P.goldD,marginBottom:5}}>PERIODOS</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {!(cl.periodos||[]).length&&<span style={{fontSize:12,color:P.gray}}>Sin periodos</span>}
                {(cl.periodos||[]).map((p,i)=><span key={i} style={{fontSize:11,background:P.lightG,color:P.goldD,padding:"2px 9px",borderRadius:99,fontWeight:600,border:`1px solid ${P.border}`}}>📅 {p}</span>)}
              </div>
            </div>)}
          </div>
        </>}

        {view==="colabs"&&<>
          <h2 style={{margin:"0 0 18px",color:P.black,fontSize:19,fontWeight:800}}>👥 Colaboradores</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
            {users.map(c=>{
              const pe=tasks.filter(t=>String(t.assignedTo)===String(c.id)&&t.status==="inprogress").length;
              const pa=tasks.filter(t=>String(t.assignedTo)===String(c.id)&&t.status==="paused").length;
              const pq=tasks.filter(t=>String(t.assignedTo)===String(c.id)&&t.status==="queued").length;
              const pp=projects.filter(p=>String(p.assignedTo)===String(c.id)&&p.status!=="completado").length;
              return <div key={c.id} style={{background:P.white,borderRadius:12,border:`1.5px solid ${P.border}`,padding:16}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <div style={{width:40,height:40,borderRadius:"50%",background:rbg(c.role),border:`2px solid ${P.gold}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>{c.avatar}</div>
                    <div><div style={{fontWeight:700,color:P.black,fontSize:13}}>{c.name}</div><span style={{...rBadge(c.role),fontSize:10}}>{rl(c.role)}</span></div>
                  </div>
                  {isJ&&<button onClick={()=>setEditColab(c)} style={{padding:"4px 9px",background:P.lightG,border:`1px solid ${P.border}`,borderRadius:7,cursor:"pointer",fontSize:12}}>✏️</button>}
                </div>
                <div style={{fontSize:12,color:P.gray,marginBottom:8}}>✉️ <a href={`mailto:${c.email}`} style={{color:P.goldD,textDecoration:"none"}}>{c.email}</a></div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {pe>0&&<span style={{fontSize:10,background:P.lightG,color:P.goldD,padding:"2px 7px",borderRadius:99,fontWeight:600,border:`1px solid ${P.border}`}}>▶ {pe}</span>}
                  {pa>0&&<span style={{fontSize:10,background:"#FFF0CC",color:P.goldD,padding:"2px 7px",borderRadius:99,fontWeight:600}}>⏸ {pa}</span>}
                  {pq>0&&<span style={{fontSize:10,background:"#EDE9FE",color:P.urgent,padding:"2px 7px",borderRadius:99,fontWeight:600}}>⏳ {pq}</span>}
                  {pp>0&&<span style={{fontSize:10,background:"#CCFBF1",color:P.proj,padding:"2px 7px",borderRadius:99,fontWeight:600}}>🗂 {pp}</span>}
                </div>
              </div>;
            })}
          </div>
        </>}

        {view==="report"&&<ReporteView tasks={tasks} projects={projects} clients={clients} users={users}/>}

        {view==="team"&&isJ&&<>
          <h2 style={{margin:"0 0 18px",color:P.black,fontSize:19,fontWeight:800}}>🏠 Vista del Equipo</h2>
          {ROLE_ORDER.filter(r=>r!=="jefe").map(r=>{
            const ms=users.filter(u=>u.role===r);if(!ms.length)return null;
            return <div key={r} style={{marginBottom:22}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={rBadge(r)}>{rl(r)}</span><span style={{fontSize:12,color:P.gray}}>{ms.length} miembro{ms.length>1?"s":""}</span></div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
                {ms.map(u=>{
                  const ut=tasks.filter(t=>String(t.assignedTo)===String(u.id)&&!t.parentId);
                  const up=projects.filter(p=>String(p.assignedTo)===String(u.id));
                  const d=ut.filter(t=>t.status==="done").length,a=ut.filter(t=>t.status==="inprogress").length,p=ut.filter(t=>t.status==="paused").length,q=ut.filter(t=>t.status==="queued").length;
                  const th=ut.reduce((s,t)=>s+(t.hours||0),0);
                  const thP=up.reduce((s,pr)=>s+(pr.sesiones||[]).reduce((ss,se)=>ss+msToH(se.activeMs),0),0);
                  return <div key={u.id} style={{background:P.white,borderRadius:12,border:`1.5px solid ${P.border}`,padding:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                      <div style={{width:34,height:34,borderRadius:"50%",background:rbg(u.role),border:`2px solid ${P.gold}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{u.avatar}</div>
                      <div style={{fontWeight:700,color:P.black,fontSize:12}}>{u.firstName} {u.lastName}</div>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
                      {[{l:"▶",v:a,col:P.gold},{l:"⏸",v:p,col:P.goldD},{l:"⏳",v:q,col:P.urgent},{l:"✅",v:d,col:P.success},{l:"⏱ Tareas",v:`${th}h`,col:P.black},{l:"🗂 Proy.",v:`${Math.round(thP*100)/100}h`,col:P.proj}].map(({l,v,col})=><div key={l} style={{background:P.lightG,borderRadius:6,padding:"5px 6px",textAlign:"center",border:`1px solid ${P.border}44`}}>
                        <div style={{fontSize:9,color:P.gray}}>{l}</div><div style={{fontSize:12,fontWeight:800,color:col}}>{v}</div>
                      </div>)}
                    </div>
                  </div>;
                })}
              </div>
            </div>;
          })}
        </>}
      </div>

      {/* MODALES */}
      {showDel&&(()=>{const t=tasks.find(t=>String(t.id)===String(showDel));return <Modal title="🗑️ Eliminar Tarea" onClose={()=>setShowDel(null)}>
        <p style={{fontSize:14,color:P.dark,margin:"0 0 10px"}}>¿Eliminar esta tarea permanentemente?</p>
        <div style={{background:P.lightG,border:`1px solid ${P.border}`,borderRadius:8,padding:"10px 14px",marginBottom:12}}><span style={{fontWeight:700,color:P.black}}>{t?.title}</span></div>
        <p style={{fontSize:12,color:P.danger,margin:"0 0 16px"}}>⚠️ Esta acción no se puede deshacer.</p>
        <BtnRow onCancel={()=>setShowDel(null)} onConfirm={async()=>{await fbDel("tasks",showDel);setShowDel(null);}} label="Sí, eliminar" color={P.danger}/>
      </Modal>;})()}

      {showEv&&<Modal title="📌 Evento No Relacionado" onClose={()=>setShowEv(null)}>
        <p style={{fontSize:13,color:P.gray,margin:"0 0 12px"}}>Indica el nombre del evento externo:</p>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Nombre del evento *</label>
        <input value={evNombre} onChange={e=>setEvNombre(e.target.value)} onKeyDown={e=>e.key==="Enter"&&confirmarEv()} placeholder="Ej: Reunión administrativa..." style={iSt} autoFocus/>
        <BtnRow onCancel={()=>setShowEv(null)} onConfirm={confirmarEv} label="📌 Registrar y pausar" color={P.danger} disabled={!evNombre.trim()}/>
      </Modal>}

      {showObs&&(()=>{
        const item=tasks.find(t=>String(t.id)===String(showObs));const ms=item?liveMs(item):0;
        const extMs=liveExtMs(showObs);
        return <Modal title="✅ Completar Tarea" onClose={()=>setShowObs(null)}>
          <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Observación <span style={{fontWeight:400,color:P.gray}}>(opcional)</span></label>
          <textarea value={obsT} onChange={e=>setObsT(e.target.value)} placeholder="Ej: Se encontraron diferencias..." style={{...iSt,height:80,resize:"vertical"}}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            <div style={{background:P.lightG,border:`1.5px solid ${P.gold}`,borderRadius:10,padding:12,textAlign:"center"}}>
              <div style={{fontSize:11,fontWeight:700,color:P.goldD}}>TIEMPO NORMAL</div>
              <div style={{fontSize:18,fontWeight:800,color:P.black}}>{fmtT(ms)}</div>
              <div style={{fontSize:11,color:P.gray}}>≈ {msToH(ms)}h</div>
            </div>
            {extMs>0&&<div style={{background:"#F5F3FF",border:`1.5px solid ${P.ext}`,borderRadius:10,padding:12,textAlign:"center"}}>
              <div style={{fontSize:11,fontWeight:700,color:P.ext}}>🌙 TIEMPO EXTENDIDO</div>
              <div style={{fontSize:18,fontWeight:800,color:P.ext}}>{fmtT(extMs)}</div>
              <div style={{fontSize:11,color:P.gray}}>≈ {msToH(extMs)}h</div>
            </div>}
          </div>
          <BtnRow onCancel={()=>setShowObs(null)} onConfirm={doComplete} label="✅ Confirmar" color={P.gold}/>
        </Modal>;
      })()}

      {showCP&&<Modal title="🔑 Cambiar Contraseña" onClose={()=>{setShowCP(false);setPErr("");setPf({current:"",nuevo:"",confirm:""});}}>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Actual</label><input value={pf.current} onChange={e=>setPf({...pf,current:e.target.value})} type="password" style={iSt}/>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Nueva</label><input value={pf.nuevo} onChange={e=>setPf({...pf,nuevo:e.target.value})} type="password" style={iSt}/>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Confirmar</label><input value={pf.confirm} onChange={e=>setPf({...pf,confirm:e.target.value})} type="password" style={iSt}/>
        {pErr&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"8px 12px",color:P.danger,fontSize:13,marginBottom:10}}>⚠️ {pErr}</div>}
        {pOk&&<div style={{background:"#F0FDF4",border:"1px solid #BBF7D0",borderRadius:8,padding:"8px 12px",color:P.success,fontSize:13,marginBottom:10}}>✅ ¡Actualizada!</div>}
        <BtnRow onCancel={()=>{setShowCP(false);setPErr("");setPf({current:"",nuevo:"",confirm:""}); }} onConfirm={savePass} label="Guardar" color={P.black}/>
      </Modal>}

      {showCF&&<Modal title={editCl?(canClients?"✏️ Editar Cliente":"📅 Agregar Periodo"):"🏢 Nuevo Cliente"} onClose={()=>setShowCF(false)}>
        {canClients&&<><label style={{fontSize:13,fontWeight:600,color:P.dark}}>Compañía</label>
        <input value={clf.compania} onChange={e=>setClf({...clf,compania:e.target.value})} style={iSt}/>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Tipos de Devolución</label>
        <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:6,marginBottom:12,maxHeight:200,overflowY:"auto",padding:8,border:`1px solid ${P.border}`,borderRadius:7,background:P.lightG}}>
          {TIPOS_DEVOLUCION.map(td=><label key={td} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:P.dark,padding:"4px 6px",borderRadius:6,background:clf.tiposDevolucion.includes(td)?P.white:"transparent"}}>
            <input type="checkbox" checked={clf.tiposDevolucion.includes(td)} onChange={()=>toggleTipoDevolucion(td)} style={{accentColor:P.goldD,width:14,height:14}}/>{td}
          </label>)}
        </div>
        {clf.tiposDevolucion.length===0&&<p style={{fontSize:11,color:P.danger,margin:"-8px 0 10px"}}>* Selecciona al menos uno</p>}</>}
        {canAddPeriodos&&editCl&&<div style={{background:"#F0F9FF",border:`1px solid ${P.ai}`,borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:"#0369A1"}}>📋 <strong>{clf.compania}</strong></div>}
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Periodos</label>
        {clf.periodos.map((p,i)=><div key={i} style={{display:"flex",gap:6,marginTop:4,marginBottom:6}}>
          <input value={p} onChange={e=>{const ps=[...clf.periodos];ps[i]=e.target.value;setClf({...clf,periodos:ps});}} placeholder="Ej: Enero 2025" style={{...iSt,marginTop:0,marginBottom:0,flex:1}}/>
          {canClients&&clf.periodos.length>1&&<button onClick={()=>setClf({...clf,periodos:clf.periodos.filter((_,idx)=>idx!==i)})} style={{padding:"0 10px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:7,cursor:"pointer",color:P.danger,fontWeight:700,fontSize:16}}>×</button>}
        </div>)}
        <button onClick={()=>setClf({...clf,periodos:[...clf.periodos,""]})} style={{width:"100%",padding:7,border:`1.5px dashed ${P.border}`,borderRadius:7,background:"transparent",color:P.gray,cursor:"pointer",fontSize:13,marginBottom:14,fontWeight:600}}>+ Agregar periodo</button>
        <BtnRow onCancel={()=>setShowCF(false)} onConfirm={saveCl} label={editCl?"Guardar":"Crear"} color={P.black}/>
      </Modal>}

      {showNT&&<Modal title="📋 Nueva Tarea" onClose={()=>setShowNT(false)}>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Actividad</label>
        <select value={nt.title} onChange={e=>setNt({...nt,title:e.target.value})} style={iSt}>
          <option value="">Selecciona actividad...</option>
          {TASKS_LIST.map(t=><option key={t} value={t}>{t}</option>)}
          {customActivities.map(t=><option key={t} value={t}>✨ {t}</option>)}
        </select>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Asignar a</label>
        <select value={nt.assignedTo} onChange={e=>setNt({...nt,assignedTo:e.target.value})} style={iSt}>
          <option value="">Selecciona persona...</option>
          {assignTo.map(u=><option key={u.id} value={u.id}>{u.avatar} {u.firstName} {u.lastName} — {rl(u.role)}</option>)}
        </select>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Cliente</label>
        <select value={nt.clientId} onChange={e=>setNt({...nt,clientId:e.target.value,tipoDevolucion:"",periodos:[]})} style={iSt}>
          <option value="">Selecciona cliente...</option>
          {clients.map(c=><option key={c.id} value={c.id}>{c.compania}</option>)}
        </select>
        {nt.clientId&&<>
          <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Tipo de Devolución</label>
          <select value={nt.tipoDevolucion} onChange={e=>setNt({...nt,tipoDevolucion:e.target.value,periodos:[]})} style={iSt}>
            <option value="">Selecciona tipo...</option>
            {(clients.find(c=>String(c.id)===String(nt.clientId))?.tiposDevolucion||[]).map(td=><option key={td} value={td}>{td}</option>)}
          </select>
          {nt.tipoDevolucion&&<>
            <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Periodos <span style={{fontWeight:400,color:P.goldD,fontSize:11}}>(selecciona uno o varios)</span></label>
            <div style={{display:"flex",flexDirection:"column",gap:5,marginTop:6,marginBottom:12,maxHeight:160,overflowY:"auto",padding:8,border:`1px solid ${P.border}`,borderRadius:7,background:P.lightG}}>
              {(clients.find(c=>String(c.id)===String(nt.clientId))?.periodos||[]).map(p=><label key={p} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:P.dark,padding:"4px 6px",borderRadius:6,background:nt.periodos.includes(p)?P.white:"transparent",border:nt.periodos.includes(p)?`1px solid ${P.border}`:"1px solid transparent"}}>
                <input type="checkbox" checked={nt.periodos.includes(p)} onChange={()=>setNt({...nt,periodos:nt.periodos.includes(p)?nt.periodos.filter(x=>x!==p):[...nt.periodos,p]})} style={{accentColor:P.goldD,width:14,height:14}}/>
                📅 {p}
              </label>)}
            </div>
            {nt.periodos.length>0&&<div style={{background:"#F0F9FF",border:`1px solid ${P.ai}`,borderRadius:7,padding:"7px 10px",marginBottom:10,fontSize:12,color:"#0369A1"}}>
              ✅ Se crearán <strong>{nt.periodos.length} tarea{nt.periodos.length>1?"s":""}</strong>: {nt.periodos.join(", ")}
            </div>}
          </>}
        </>}
        <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",marginBottom:12,fontSize:13,fontWeight:600,color:P.urgent}}>
          <input type="checkbox" checked={nt.urgente} onChange={e=>setNt({...nt,urgente:e.target.checked})} style={{accentColor:P.urgent,width:15,height:15}}/>
          ⚡ Marcar como URGENTE
        </label>
        {hasActiveTask(nt.assignedTo)&&nt.assignedTo&&!nt.urgente&&<div style={{background:"#EDE9FE",border:`1px solid ${P.urgent}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:P.urgent}}>⏳ Quedará en cola.</div>}
        <BtnRow onCancel={()=>setShowNT(false)} onConfirm={addTaskMasiva} label={`Crear${nt.periodos.length>1?` ${nt.periodos.length} tareas`:" tarea"}`} color={P.black} disabled={!nt.title||!nt.assignedTo||nt.periodos.length===0}/>
      </Modal>}

      {showST&&<Modal title="➕ Sub-tarea" onClose={()=>setShowST(null)}>
        <div style={{background:"#F0F9FF",border:`1px solid ${P.ai}`,borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:"#0369A1"}}>La sub-tarea aparecerá en el tablero del colaborador asignado.</div>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Actividad</label>
        <select value={nst.title} onChange={e=>setNst({...nst,title:e.target.value})} style={iSt}>
          <option value="">Selecciona actividad...</option>
          {allActivities.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Asignar a</label>
        <select value={nst.assignedTo} onChange={e=>setNst({...nst,assignedTo:e.target.value})} style={iSt}>
          <option value="">Selecciona persona...</option>
          {subTo.map(u=><option key={u.id} value={u.id}>{u.avatar} {u.firstName} {u.lastName} — {rl(u.role)}</option>)}
        </select>
        <BtnRow onCancel={()=>setShowST(null)} onConfirm={()=>addSub(showST)} label="Asignar" color={P.black} disabled={!nst.title||!nst.assignedTo}/>
      </Modal>}

      {showNProy&&<Modal title="🗂 Nuevo Proyecto" onClose={()=>setShowNProy(false)}>
        <div style={{background:"#F0FDFA",border:`1px solid #99F6E4`,borderRadius:8,padding:"8px 12px",marginBottom:14,fontSize:12,color:P.proj}}>Se gestiona por sesiones de trabajo con cronómetro libre.</div>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Nombre del proyecto</label>
        <input value={nproy.nombre} onChange={e=>setNproy({...nproy,nombre:e.target.value})} placeholder="Ej: Auditoría Q1 Empresa ABC" style={iSt}/>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Asignar a</label>
        <select value={nproy.assignedTo} onChange={e=>setNproy({...nproy,assignedTo:e.target.value})} style={iSt}>
          <option value="">Selecciona colaborador...</option>
          {projAssignTo.map(u=><option key={u.id} value={u.id}>{u.avatar} {u.firstName} {u.lastName} — {rl(u.role)}</option>)}
        </select>
        <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Cliente</label>
        <select value={nproy.clientId} onChange={e=>setNproy({...nproy,clientId:e.target.value,tipoDevolucion:"",periodos:[]})} style={iSt}>
          <option value="">Selecciona cliente...</option>
          {clients.map(c=><option key={c.id} value={c.id}>{c.compania}</option>)}
        </select>
        {nproy.clientId&&<>
          <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Tipo de Devolución</label>
          <select value={nproy.tipoDevolucion} onChange={e=>setNproy({...nproy,tipoDevolucion:e.target.value,periodos:[]})} style={iSt}>
            <option value="">Selecciona tipo...</option>
            {(clients.find(c=>String(c.id)===String(nproy.clientId))?.tiposDevolucion||[]).map(td=><option key={td} value={td}>{td}</option>)}
          </select>
          {nproy.tipoDevolucion&&<>
            <label style={{fontSize:13,fontWeight:600,color:P.dark}}>Periodos <span style={{fontWeight:400,color:P.goldD,fontSize:11}}>(selecciona uno o varios — se crea un proyecto por cada uno)</span></label>
            <div style={{display:"flex",flexDirection:"column",gap:5,marginTop:6,marginBottom:12,maxHeight:160,overflowY:"auto",padding:8,border:`1px solid ${P.border}`,borderRadius:7,background:P.lightG}}>
              {(clients.find(c=>String(c.id)===String(nproy.clientId))?.periodos||[]).map(p=><label key={p} style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:P.dark,padding:"4px 6px",borderRadius:6,background:nproy.periodos.includes(p)?P.white:"transparent",border:nproy.periodos.includes(p)?`1px solid ${P.border}`:"1px solid transparent"}}>
                <input type="checkbox" checked={nproy.periodos.includes(p)} onChange={()=>setNproy({...nproy,periodos:nproy.periodos.includes(p)?nproy.periodos.filter(x=>x!==p):[...nproy.periodos,p]})} style={{accentColor:P.goldD,width:14,height:14}}/>
                📅 {p}
              </label>)}
            </div>
            {nproy.periodos.length>0&&<div style={{background:"#F0FDFA",border:`1px solid #99F6E4`,borderRadius:7,padding:"7px 10px",marginBottom:10,fontSize:12,color:P.proj}}>
              🗂 Se crearán <strong>{nproy.periodos.length} proyecto{nproy.periodos.length>1?"s":""}</strong>: {nproy.periodos.join(", ")}
            </div>}
          </>}
        </>}
        <BtnRow onCancel={()=>setShowNProy(false)} onConfirm={addProyecto} label={`Crear${nproy.periodos.length>1?` ${nproy.periodos.length} proyectos`:" proyecto"}`} color={P.proj} disabled={!nproy.nombre.trim()||!nproy.assignedTo||!nproy.clientId||nproy.periodos.length===0}/>
      </Modal>}

      {showAv&&<Modal title="🎨 Elige tu Avatar" onClose={()=>setShowAv(false)}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:7,marginBottom:14}}>
          {AVATARS.map(a=><div key={a} onClick={()=>selAv(a)} style={{fontSize:26,textAlign:"center",padding:7,borderRadius:9,cursor:"pointer",background:cur.avatar===a?P.lightG:P.white,border:`2px solid ${cur.avatar===a?P.gold:P.border}`}}>{a}</div>)}
        </div>
      </Modal>}

      {editColab&&<EditColabModal user={editColab} onSave={saveColab} onClose={()=>setEditColab(null)}/>}

      {showNoUrgente&&<Modal title="⚡ Sin tareas urgentes" onClose={()=>setShowNoUrgente(false)}>
        <div style={{textAlign:"center",padding:"20px 10px"}}>
          <div style={{fontSize:52,marginBottom:14}}>💪</div>
          <p style={{fontSize:16,fontWeight:700,color:P.black,margin:"0 0 10px"}}>No tienes tareas urgentes en cola</p>
          <p style={{fontSize:14,color:P.gray,margin:"0 0 24px",lineHeight:1.5}}>¡Vamos, que seguro falta poco para que termines tu asignación!</p>
          <button onClick={()=>setShowNoUrgente(false)} style={{padding:"10px 32px",background:P.gold,color:P.black,border:"none",borderRadius:8,fontWeight:700,fontSize:14,cursor:"pointer"}}>¡A seguir! 🚀</button>
        </div>
      </Modal>}

      {showActMgr&&<Modal title="⚙️ Gestionar Actividades" onClose={()=>setShowActMgr(false)}>
        <p style={{fontSize:13,color:P.gray,margin:"0 0 10px"}}>Actividades base (no editables):</p>
        <div style={{background:P.lightG,borderRadius:8,padding:"8px 10px",marginBottom:16,border:`1px solid ${P.border}`}}>
          {TASKS_LIST.map((a,i)=><div key={i} style={{fontSize:12,color:P.gray,padding:"3px 0",borderBottom:i<TASKS_LIST.length-1?`1px solid ${P.border}22`:"none"}}>• {a}</div>)}
        </div>
        <p style={{fontSize:13,fontWeight:700,color:P.dark,margin:"0 0 8px"}}>✨ Personalizadas:</p>
        {customActivities.length===0&&<div style={{fontSize:12,color:P.gray,marginBottom:10,fontStyle:"italic"}}>Ninguna aún.</div>}
        {customActivities.map((a,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 10px",background:P.white,borderRadius:7,marginBottom:5,border:`1px solid ${P.border}`}}>
          <span style={{fontSize:13}}>✨ {a}</span>
          <button onClick={()=>deleteActivity(a)} style={{padding:"3px 8px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:6,cursor:"pointer",color:P.danger,fontWeight:700,fontSize:12}}>🗑️</button>
        </div>)}
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <input value={newAct} onChange={e=>setNewAct(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveActivity()} placeholder="Nueva actividad..." style={{...iSt,marginTop:0,marginBottom:0,flex:1}}/>
          <button onClick={saveActivity} disabled={!newAct.trim()||allActivities.includes(newAct.trim())} style={{padding:"9px 16px",background:P.black,color:P.gold,border:"none",borderRadius:7,fontWeight:700,cursor:"pointer",flexShrink:0,opacity:(!newAct.trim()||allActivities.includes(newAct.trim()))?0.5:1}}>+ Agregar</button>
        </div>
      </Modal>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
